#map{position:fixed; inset:0; background:var(--mapbg)}
.leaflet-container{background:var(--mapbg); font-family:var(--sans)}
.leaflet-bottom.leaflet-left{bottom:calc(var(--bot) - 4px); left:4px}
.leaflet-control-attribution{background:var(--mapchip)!important;
  color:var(--mapchip-ink)!important; font-size:9px!important; padding:1px 6px; border-radius:5px;
  white-space:nowrap; line-height:1.5}
.leaflet-control-attribution a{color:var(--mapchip-ink)!important}
.leaflet-control-scale-line{background:var(--mapchip); color:var(--mapchip-ink);
  border-color:var(--mapchip-line)!important; font-family:var(--mono); font-size:10px; padding:1px 5px}

/* 핀 */
.pin{display:grid; place-items:center; width:100%; height:100%; position:relative}
.pin.stop b{width:28px; height:28px; border-radius:50%; background:var(--pinbg); border:2.5px solid var(--dc);
  color:var(--dc); font:800 12px/1 var(--mono); display:grid; place-items:center;
  box-shadow:0 1px 5px rgba(0,0,0,.28); transition:transform .12s}
.pin.multi b{background:var(--dc); color:var(--ondc)}
.pin.on b{background:var(--dc); color:var(--ondc); transform:scale(1.16)}
.pin.opt b{border-style:dashed}
.pin .pinlabel{position:absolute; left:calc(50% + 19px); top:50%; transform:translateY(-50%); font-style:normal;
  font-size:11.5px; font-weight:800; letter-spacing:-.02em; white-space:nowrap; color:var(--pinink); pointer-events:none;
  text-shadow:0 0 3px var(--pinhalo),0 0 3px var(--pinhalo),0 0 5px var(--pinhalo),0 0 9px var(--pinhalo),0 0 12px var(--pinhalo)}
.pin.move{width:13px; height:13px; border-radius:50%; background:var(--dc); opacity:.85; border:2px solid var(--pinbg)}
.pin.stay{width:28px; height:28px; border-radius:50%; background:var(--pinbg); border:2px solid var(--pinink);
  color:var(--pinink); box-shadow:0 1px 5px rgba(0,0,0,.3)}

/* ── 상단 ── */
.top{position:fixed; top:0; left:0; right:0; z-index:900;
  padding:calc(env(safe-area-inset-top,0px) + 9px) 10px 9px;
  background:linear-gradient(var(--bg) 52%, transparent); pointer-events:none}
.top > *{pointer-events:auto}
.tbar{display:flex; align-items:center; gap:8px; margin-bottom:9px; padding:0 4px}
.brand{font-size:14px; font-weight:800; letter-spacing:-.03em; white-space:nowrap}
.brand span{color:var(--ink-3); font-weight:600; font-size:11.5px; margin-left:7px; font-family:var(--mono)}
/* 아주 좁은 화면(SE 등)에서 버튼 3개가 밀려나지 않게 날짜를 접는다 */
@media (max-width:359px){.brand span{display:none}}
.spacer{flex:1}
.iconbtn{width:38px; height:38px; border-radius:11px; background:var(--panel); box-shadow:var(--shadow);
  display:grid; place-items:center; flex:0 0 auto}
.iconbtn svg{width:18px; height:18px; stroke:var(--ink); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.days{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:2px 4px 4px}
.days::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto; padding:7px 13px; border-radius:11px; background:var(--panel); box-shadow:var(--shadow);
  font-size:12.5px; font-weight:700; white-space:nowrap; color:var(--ink-2); display:flex; align-items:center; gap:6px}
.dchip i{width:8px; height:8px; border-radius:50%; background:var(--dc); font-style:normal; flex:0 0 auto}
.dchip[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.dchip[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--bg)}
.dchip small{font-family:var(--mono); font-size:10.5px; opacity:.62; font-weight:600}

.ctrl{position:fixed; right:10px; z-index:800; display:grid; gap:7px; bottom:calc(var(--bot) + 10px)}
.ctrl .iconbtn{width:40px; height:40px}

/* ── 하단 스트립 ── */
.strip{position:fixed; left:0; right:0; bottom:0; z-index:900;
  padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 10px);
  background:linear-gradient(transparent, var(--bg) 44%);
  display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.scard{flex:0 0 auto; scroll-snap-align:center; width:172px; text-align:left; background:var(--panel);
  border-radius:13px; box-shadow:var(--shadow); padding:10px 12px; border:1.5px solid transparent}
.scard:active{transform:scale(.975)}
.scard[aria-current="true"]{border-color:var(--dc)}
.scard.opt{border-style:dashed; border-color:var(--ink-3)}
.scard .st{display:flex; align-items:center; gap:6px; margin-bottom:3px}
.scard .num{width:17px; height:17px; border-radius:50%; background:var(--dc); color:var(--ondc); font-family:var(--mono);
  font-size:10px; font-weight:800; display:grid; place-items:center; flex:0 0 auto}
.scard .num.mv{background:none; border:1.5px solid var(--dc); color:var(--dc); font-size:0}
.scard .tm{font-family:var(--mono); font-size:11.5px; font-weight:700; color:var(--ink-2)}
.scard .dur{font-family:var(--mono); font-size:10px; color:var(--ink-3); margin-left:auto}
.optchip{font-family:var(--mono); font-size:9px; font-weight:800; letter-spacing:.1em; padding:2px 5px;
  border-radius:5px; background:var(--panel-2); color:var(--ink-3); margin-left:auto}
.scard .nm{font-size:13px; font-weight:700; letter-spacing:-.02em; line-height:1.35; overflow:hidden;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}

/* ── 시트 ── */
.scrim{position:fixed; inset:0; background:rgba(10,14,12,.42); z-index:1000; opacity:0; pointer-events:none;
  transition:opacity .22s}
.scrim.on{opacity:1; pointer-events:auto}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:1100; background:var(--panel);
  border-radius:20px 20px 0 0; box-shadow:0 -8px 40px -8px rgba(0,0,0,.35);
  transform:translateY(101%); transition:transform .3s cubic-bezier(.22,.9,.3,1);
  display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.grab{padding:9px 0 4px; display:grid; place-items:center; flex:0 0 auto; touch-action:none}
.grab::before{content:""; width:38px; height:4px; border-radius:2px; background:var(--line)}
.sheet-in{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 20px 24px; max-height:58dvh}
.sh-opt{margin:0 0 12px; font-size:12.5px; font-weight:700; color:var(--ink-3); font-family:var(--mono);
  border:1px dashed var(--line); border-radius:8px; padding:7px 11px; display:inline-block}
.sh-head{display:flex; align-items:flex-start; gap:11px; margin-bottom:11px}
.sh-num{width:27px; height:27px; border-radius:50%; background:var(--dc); color:var(--ondc); flex:0 0 auto;
  font-family:var(--mono); font-size:12px; font-weight:800; display:grid; place-items:center; margin-top:2px}
.sh-num.mv{background:none; border:2px solid var(--dc); color:var(--dc)}
.sh-t{font-size:19px; font-weight:800; letter-spacing:-.032em; line-height:1.3}
.sh-ja{font-family:var(--mono); font-size:11.5px; color:var(--ink-3); margin-top:3px}
.sh-meta{display:flex; flex-wrap:wrap; gap:7px; margin:13px 0}
.pill{font-family:var(--mono); font-size:11px; font-weight:600; padding:5px 9px; border-radius:8px;
  background:var(--panel-2); color:var(--ink-2)}
.pill.k{background:color-mix(in srgb,var(--dc) 15%,transparent); color:var(--dc); font-weight:700}
.sh-desc{font-size:14.5px; color:var(--ink-2); line-height:1.75}
.sh-tip{margin-top:13px; background:var(--panel-2); border-radius:11px; padding:12px 14px; font-size:13.5px;
  line-height:1.7; color:var(--ink-2); border-left:3px solid var(--dc)}
.sh-tip::before{content:"팁"; display:block; font-family:var(--mono); font-size:9.5px; font-weight:800;
  letter-spacing:.14em; color:var(--dc); margin-bottom:5px}
.sh-tip.warn{border-left-color:var(--accent)}
.sh-tip.warn::before{content:"주의"; color:var(--accent)}
.sh-tip strong{color:var(--ink); font-weight:700}
.sh-nav{display:flex; gap:8px; margin-top:10px}
.navbtn{flex:1; padding:12px; border-radius:12px; background:var(--panel-2); font-size:13.5px; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:7px; text-decoration:none; color:inherit}
.navbtn.ext{margin-top:16px; background:color-mix(in srgb,var(--accent) 13%,transparent); color:var(--accent)}
.navbtn:disabled{opacity:.32}
.navbtn .mono{font-size:11px; color:var(--ink-3); font-weight:600}

/* ── 정보 모달 ── */
.modal{position:fixed; inset:0; z-index:1200; background:var(--bg); transform:translateY(101%);
  transition:transform .3s cubic-bezier(.22,.9,.3,1); display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
.modal.on{transform:none}
.mhead{display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); flex:0 0 auto}
.mhead h2{margin:0; font-size:16px; font-weight:800; letter-spacing:-.03em}
.mtabs{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:10px 14px; flex:0 0 auto;
  border-bottom:1px solid var(--line)}
.mtabs::-webkit-scrollbar{display:none}
.mtab{flex:0 0 auto; padding:6px 12px; border-radius:9px; background:var(--panel); font-size:12.5px;
  font-weight:700; color:var(--ink-2); white-space:nowrap}
.mtab[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.mbody{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 40px)}
.msec{display:none} .msec.on{display:block}
.prose h4{font-size:13.5px; font-weight:800; margin:20px 0 7px; padding-bottom:6px; border-bottom:1px solid var(--line)}
.prose h4:first-child{margin-top:0}
.prose p{font-size:14px; color:var(--ink-2); line-height:1.75; margin:6px 0; max-width:70ch}
.prose ul{margin:6px 0; padding:0; list-style:none; display:grid; gap:5px}
.prose li{font-size:14px; color:var(--ink-2); line-height:1.7; padding-left:15px; position:relative; max-width:70ch}
.prose li::before{content:""; position:absolute; left:2px; top:.72em; width:5px; height:1.5px; background:var(--ink-3)}
.prose li.arrow::before{content:"→"; background:none; left:0; top:0; font-family:var(--mono); font-size:11px;
  color:var(--accent); width:auto; height:auto}
.prose strong{color:var(--ink); font-weight:700}
.card{background:var(--panel); border-radius:13px; padding:15px 17px; margin-bottom:11px; box-shadow:var(--shadow)}
.card h5{margin:0 0 4px; font-size:11px; font-family:var(--mono); letter-spacing:.11em; color:var(--ink-3);
  text-transform:uppercase; font-weight:700}
.card .big{font-size:15.5px; font-weight:750; letter-spacing:-.025em; line-height:1.5}
.card .sm{font-size:13px; color:var(--ink-2); margin-top:5px; line-height:1.65}
.chk{display:flex; gap:11px; padding:13px 15px; align-items:flex-start; background:var(--panel);
  border-radius:12px; margin-bottom:8px; cursor:pointer; box-shadow:var(--shadow)}
.chk input{appearance:none; -webkit-appearance:none; width:20px; height:20px; border:2px solid var(--ink-3);
  border-radius:6px; margin:2px 0 0; flex:0 0 auto; position:relative}
.chk input:checked{background:var(--accent); border-color:var(--accent)}
.chk input:checked::after{content:""; position:absolute; left:6px; top:2px; width:4px; height:9px;
  border:solid #fff; border-width:0 2px 2px 0; transform:rotate(42deg)}
.chk-t{font-size:13.5px; line-height:1.65; color:var(--ink-2); min-width:0}
.chk-t b{display:block; color:var(--ink); font-size:14px; font-weight:750; margin-bottom:2px}
.chk input:checked ~ .chk-t{opacity:.4; text-decoration:line-through}
.pri{font-family:var(--mono); font-size:9.5px; font-weight:800; letter-spacing:.1em; padding:2px 6px;
  border-radius:5px; margin-right:6px; background:color-mix(in srgb,var(--accent) 15%,transparent); color:var(--accent)}
.pri.low{background:var(--panel-2); color:var(--ink-3)}

.toast{position:fixed; left:50%; transform:translate(-50%,14px); bottom:calc(var(--bot) + 62px); z-index:1300;
  background:var(--ink); color:var(--bg); font-size:12.5px; font-weight:600; padding:9px 15px; border-radius:10px;
  opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; max-width:88vw; text-align:center}
.toast.on{opacity:1; transform:translate(-50%,0)}
.ns{position:fixed; inset:0; display:grid; place-items:center; padding:30px; text-align:center;
  background:var(--bg); color:var(--ink); z-index:2000; font-size:15px; line-height:1.8}
.ns[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:840px){
  .scard{width:196px}
  .sheet{left:auto; right:14px; bottom:14px; width:400px; border-radius:18px}
  .sheet-in{max-height:64dvh}
  .modal{left:auto; width:480px; border-left:1px solid var(--line)}
}

.mlinks{display:flex; gap:7px; padding:12px 14px 0; flex-wrap:wrap; flex:0 0 auto}
.mlinks a{flex:1 1 44%; text-align:center; text-decoration:none; font-size:13px; font-weight:750;
  padding:12px 10px; border-radius:11px; color:var(--accent);
  background:color-mix(in srgb,var(--accent) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.mlnote{margin:9px 14px 0; font-size:11.5px; line-height:1.6; color:var(--ink-3); flex:0 0 auto}
</style>
</head>
<body>

<div id="map"></div>

<div class="top">
  <div class="tbar">
    <div class="brand">삿포로 4박 5일<span>2026.08.21–25</span></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btnFit" aria-label="전체 보기">
      <svg viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 011-1h4M20 9V5a1 1 0 00-1-1h-4M4 15v4a1 1 0 001 1h4M20 15v4a1 1 0 01-1 1h-4"/></svg>
    </button>
    <button class="iconbtn" id="btnTheme" aria-label="어둡게 보기"></button>
    <button class="iconbtn" id="btnInfo" aria-label="여행 정보">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>
  <div class="days" id="days" role="tablist"></div>
</div>

<div class="ctrl">
  <button class="iconbtn" id="btnIn" aria-label="확대"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="iconbtn" id="btnOut" aria-label="축소"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
</div>

<div class="strip" id="strip"></div>
<div class="scrim" id="scrim"></div>

<section class="sheet" id="sheet" aria-live="polite">
  <div class="grab" id="grab"></div>
  <div class="sheet-in" id="sheetIn"></div>
</section>

<section class="modal" id="modal" aria-hidden="true">
  <div class="mhead">
    <button class="iconbtn" id="btnClose" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    <h2>여행 정보</h2>
  </div>
  <div class="mlinks">
    <a href="guide.html">명소 가이드 · 후기와 링크</a>
    <a href="plan.html">일정 전문 읽기</a>
  </div>
  <p class="mlnote">가이드에는 각 장소의 후기·평점과 공식·구글지도 링크, 8/24 후보지 비교가 있습니다. 일정 전문은 인터넷 없이도 열립니다.</p>
  <div class="mtabs" id="mtabs"></div>
  <div class="mbody" id="mbody"></div>
</section>

<div class="toast" id="toast"></div>

<div class="ns" id="boot" hidden><div>
  <strong>지도를 열지 못했습니다</strong>
  <p style="margin:10px 0 0;font-size:13px;color:var(--ink-3)"></p>
  <p style="margin:14px 0 0;font-size:14px">글로 된 일정은 <a href="plan.html">여기</a>에서 볼 수 있습니다.</p>
</div></div>

<noscript><div class="ns"><div><strong>이 지도는 브라우저에서 열어야 합니다</strong><br>

<script>
const PLAN = {"title":"삿포로 4박 5일 — 오타루, 서쪽, 그리고 느린 하루 (2026.08.21~25)","concept":"\"매일 밤을 야경 + 시메(마무리) 한 잔으로 닫는다\"를 축으로 삼은 커플 4박 5일. 도착일은 짐을 삿포로역 코인로커에 맡기고 홋카이도대학 캠퍼스만 걷다가 스스키노 반경 1km 안으로 돌아와 첫날 피로를 낮게 유지하고, 토요일 하루를 오타루에 통째로 쓴 뒤, 일요일은 도심→서쪽(마루야마·미야노사와)→도심으로 되감는 한 방향 동선으로 왕복 낭비를 없앴다. 월요일 8/24는 늦잠으로 시작하는 완충일로 비워 두어, 앞의 사흘에서 못 했거나 날씨로 날아간 것을 흡수하게 했다. 야경 3개소를 성격이 겹치지 않게 나눴고(관람차=밀폐형 2인 / 모이와산=광역 파노라마 / TV타워=오도리 직선 구도), 홋카이도 시그니처 7종(징기스칸·오타루 스시·이쿠라·우니동·미소라멘·수프카레·게)을 장르 중복 없이 하루 한 끼씩 배치했다. 마지막 날 8/25(화)은 카페·JR·공항만 남겨, 출발까지 2시간 30분 이상을 남기고 공항에 도착한다.","weather":"■ 기온 (기상청 1991~2020 평년값, 삿포로 관측소)\n· 8/21 최고 26.1℃ / 최저 18.8℃ · 8/22 26.0 / 18.7 · 8/23 26.0 / 18.6 · 8/24 26.0 / 18.5 · 8/25 25.9 / 18.4\n· 【2026년 실제 전망】 기상청 1개월 예보에서 8월 하순 홋카이도 '기온 높음' 확률 60%. 2025년 홋카이도 주요 21지점이 평균기온 사상 최고를 기록했다. 평년 26℃가 아니라 낮 28~30℃를 각오할 것. 그래도 같은 시기 서울(최고 30~32℃, 습도 70~80%, 열대야)보다는 확실히 쾌적하다.\n· 【일교차가 핵심】 낮 26~30℃ / 아침·저녁 18~19℃로 8~11℃ 차이. 오봉 이후라 아침저녁이 뚜렷하게 서늘해지는 시기다.\n\n■ 일출/일몰 (국립천문대 확정치) — 서울보다 일몰이 약 50분 이르다\n· 8/21 04:46 / 18:29 · 8/22 04:47 / 18:27 · 8/23 04:48 / 18:25 · 8/24 04:50 / 18:24 · 8/25 04:51 / 18:22\n→ 야경은 19:00 이후에야 제대로 어두워진다. 이 일정은 그 전제로 8/21 아카렌가를 일몰 30분 전인 18:00 골든아워에, 8/23 모이와산을 완전 야간인 19:40에, 8/24 TV타워를 20:50에 배치했다. 세 곳의 빛 조건이 전부 다르다.\n\n■ 비 (반드시 대비할 것)\n· 8월은 삿포로에서 강수량이 가장 많은 달 중 하나. 월 강수일수 13~16일 → 하루 비 확률 40~50%. 4박 5일이면 하루나 이틀은 비를 만난다고 보는 것이 안전하다. 접이식 우산 2개는 협상 불가.\n· 【이 일정은 비에 강하다】 8/24를 완충일로 비워 뒀기 때문에, 8/23에 비가 오면 8/23과 8/24를 통째로 맞바꾸면 된다. 사흘짜리 일정에는 없던 여유다.\n· 태풍: 8월 하순 홋카이도 직접 상륙은 통계적으로 드물지만, 혼슈 접근 태풍 여파로 8/25 낮 신치토세 항공편이 지연될 가능성은 있다.\n\n■ 복장 가이드\n· 낮: 반팔 + 얇은 면·린넨 팬츠/스커트. 한여름 서울 복장 그대로 OK.\n· 아침·저녁·실내: 얇은 가디건·셔츠·재킷 등 겉옷 1벌 필수. 저녁 18시 이후 18~19℃까지 떨어진다.\n· 【모이와산 전용】 정상(531m)은 시내보다 3~5℃ 낮고 바람이 세서 체감 15℃ 이하. 8/23 밤에는 여자친구용 얇은 후드나 바람막이를 배낭에 따로 넣어 갈 것. 이 한 벌이 그날 밤 만족도를 가른다.\n· 여자친구 추천: 원피스 + 얇은 가디건. 온도 조절이 되고 사진도 잘 나온다. 오타루 사카이마치·운하는 어두운 석조 배경이라 밝은 색 원피스가 확실히 산다.\n· 신발: 편한 스니커즈. 삿포로역~오도리~스스키노~니조시장은 하루 1만 보 이상이고, 오타루 운하 주변은 돌·요철 구간이라 힐은 절대 비추천.\n· 자외선: 오도리공원·오타루 운하는 그늘이 적다. 모자·선글라스·선크림.","transport":"■ 결론: 표를 살 필요가 거의 없다 — 컨택리스 카드 터치가 이번 여행 최대의 편의 변수\n2026년 3월 26일부터 삿포로 지하철 전 49개역에서 크레카 터치 승차가 정식 도입됐고, 4월 27일부터는 시전차도 개시됐다. Visa/Mastercard/JCB/AmEx/Diners/Discover/은련 모두 대응하고 해외 발행 카드도 컨택리스 기능만 있으면 그대로 쓸 수 있다. 1일 상한요금이 자동 적용되므로 사실상 1일권을 산 것과 같아진다.\n· 지하철 상한: 평일 830엔 / 토·일·공휴일 520엔\n· 시전차 상한: 별도 계산, 토·일·공휴일 460엔\n→ 한국인이면 트래블월렛·트래블로그 등 컨택리스 체크카드를 그냥 찍고 다니는 것이 최선이다. 매표기에 줄 설 필요가 없다.\n\n■ [반드시 지킬 것] 커플은 각자 자기 카드로 태그\n같은 카드(같은 매체)를 계속 써야 1일 누적이 합산된다. 카드 한 장으로 두 명분을 찍으면 상한요금 합산도, 지하철↔버스 환승할인도 적용되지 않는다. 심지어 같은 카드번호라도 실물카드와 스마트폰을 번갈아 쓰면 합산되지 않는다. 각자 자기 카드 한 장을 정해서 닷새 내내 그것만 쓸 것.\n\n■ 공항 왕복 — JR 쾌속 에어포트 하나로 끝\n· 편도 1,230엔(2025/4/1 개정. '1,150엔'은 옛 정보), 특별쾌속 최속 33분 / 쾌속 37분, 낮 시간대 시간당 6편.\n· u시트 지정석(4호차): 에키넷 티켓리스 800엔 / 종이 1,000엔. 짐 있는 커플이면 8/21 도착편과 8/25 출발편 모두 예약 권장.\n→ 8/25는 화요일 09:40 삿포로역 출발이라 아침 통근 러시(07:30~08:30)가 끝난 뒤다. 자유석도 앉을 가능성이 높지만, 캐리어를 든 커플이라면 800엔에 좌석과 짐 공간을 확정해 두는 편이 낫다.\n· 공항버스는 2026/4/1 인상으로 1,500엔·80~90분이라 모든 면에서 불리하고, 삿포로역 버스터미널이 재개발로 폐쇄돼 남쪽 출구 임시 노상 승강장을 써야 해서 초행자에게는 찾기도 어렵다. 타지 말 것.\n\n■ 날짜별 최적안\n· 8/21(금) — 패스 불필요. 공항 JR 1,230엔 + 지하철 소액. 저녁 일정(아카렌가~다루마~노리아~타누키코지)은 사실상 전부 도보권이다.\n· 8/22(토) — 오타루 JR 왕복 1,600엔이 사실상 전부다. 시내 지하철을 거의 타지 않으니 1일권을 살 이유가 없다.\n· 8/23(일) — 이 일정에서 교통비가 가장 많이 드는 날이다. 지하철 도자이선(마루야마·미야노사와)과 시전차(모이와산)를 하루에 둘 다 쓴다. 도니치카킷푸 520엔 + 도산코패스 460엔, 또는 카드 터치로 각각의 휴일 상한(520·460)에 맡기면 된다. 어느 쪽이든 확실히 본전이 나온다.\n· 8/24(월) — 평일이라 지하철 상한이 830엔으로 올라가는데 실제 승차는 서너 번뿐이라 개별 결제가 싸다. 하루 종일 도심 안에서만 움직이고 오도리~스스키노는 지하상가 도보다.\n· 8/25(화) — 지하철 210엔 + 공항 JR 1,230엔. 그게 전부다.\n\n■ 사지 말 것 / 존재하지 않는 것\n· 공통1DAY카드(지하철+시전차+버스)는 2015년 3월 31일에 이미 폐지됐다. 아직도 소개하는 블로그가 있으니 주의 — 현재 셋을 묶는 1일권은 존재하지 않는다.\n· '삿포로·오타루 웰컴패스'는 2026년 8월 현재 JR홋카이도 공식 상품 목록에서 확인되지 않는다(confidence low). 그냥 편도권 800엔씩 사면 된다.\n· JR홋카이도 레일패스(22,000엔), 삿포로-노보리베츠/후라노 에리어패스는 이번 일정에 전혀 불필요하다.\n· 일일산책킷푸(2,730엔)는 오타루 왕복 1,600엔뿐이면 손해다.\n\n■ IC카드\n모바일 Suica / Apple Pay Suica를 한국에서 그대로 가져가 쓸 수 있다(지하철·시전차·버스·JR 전부). SAPICA는 반대로 JR홋카이도에서 못 쓰니 살 이유가 없다. 단 IC카드로는 1일 승차권을 살 수 없고, 도니치카·도산코 같은 종이 승차권은 여전히 현금으로만 판다.\n\n■ 실전 팁\n· 오도리↔스스키노는 지하상가 폴타운으로 도보 5~7분. 지하철 탈 필요가 없고 비가 와도 젖지 않는다. 8/24는 이 구간을 여러 번 쓴다.\n· 도자이선(마루야마·미야노사와)은 삿포로역에 들어오지 않는다. 반드시 오도리역에서 환승할 것.\n· 모이와산은 시전차 '로프웨이이리구치' 하차 + 무료 셔틀버스. 셔틀을 놓쳐도 서쪽 도보 500m.\n· 예상 1인 총 교통비 약 8,000엔 (공항 왕복 2,460 + u시트 왕복 1,600 + 오타루 왕복 1,600 + 지하철·시전차 약 2,400).","reservations":["【1순위·필수】 우미아지 하치쿄 본점 — 8/22(토) 19:40, 2인. 8월 성수기 토요일 저녁은 워크인이 사실상 불가능하다. 출국 전 반드시 예약할 것. 영어 예약 플랫폼 TableCheck 또는 전화. 실패 시 대체: 삿포로 카니혼케(다만 8/24에 갈 예정이라 중복) 또는 노르베사 옥상 비어가든.","【확정】 이스타항공 위탁 수하물 — 두 구간 모두 무료 위탁 포함으로 확인 완료(15kg 기준). 추가 수하물 요금을 따로 계산할 일은 없다. 귀국편에서 로이스 생초콜릿 같은 냉장 제품이나 100ml를 넘는 잼·유동식은 전부 위탁에 넣으면 된다.","【확정】 숙소 4박 연박(8/21~25) — 에어비앤비 연박 가능 확인 완료. 8/24에 숙소를 옮길 일이 없으니 그날은 짐 없이 계획대로 도시에서 느리게 보내면 된다. 체크아웃은 8/25 아침 한 번뿐.","【2순위·강력권장】 JR u시트 지정석 2건 — 에키넷 무료 가입 후 티켓리스 예약 1인 800엔. ① 8/21 신치토세공항→삿포로 ② 8/25 삿포로 09:40경→신치토세공항. 지정석은 4호차에만 있다.","【2순위·권장】 삿포로 카니혼케 삿포로에키마에 본점 — 8/24(월) 18:20, 2인. 11:30~22:00 연중무휴이고 공식 사이트·구르나비에서 예약 가능. 개별 좌식 룸을 요청하면 조용하다.","【2순위·권장】 오타루 마사즈시 본점 런치 — 8/22(토) 11:05, 2인. 예약하면 오픈런 대기 없이 앉는다. 공식 masazushi.co.jp. 정기휴무는 수요일이라 토요일은 정상 영업.","【3순위】 오타루 운하 크루즈 데이크루즈 — 8/22 12:50경. 8월 주말은 온라인 사전 예약 권장(예약센터 09:30~20:00). 악천후 결항 시 환불 규정 확인.","【3순위·확인】 숙소 짐 보관 — 체크인 시각은 16:00으로 확인됐다. 8/21 13:15에 삿포로역에 도착하니 체크인까지 약 3시간을 짐과 함께 보내게 되고, 그 사이에 삿포로역 점심과 홋카이도대학 산책이 들어간다. 호스트에게 짐 보관이 되는지 문의해 둔 상태이며, 안 되면 삿포로역 코인로커에 넣으면 된다 — 일정은 이미 그 전제로 짜여 있다.","【선택】 시로이코이비토 파크 쿠키 만들기 체험 — 8/23(일) 13:45~15:30 중. 정원제라 당일 신청이 안 될 수 있으니 관심 있으면 공식 사이트에서 사전 예약.","【선택】 홋카이도청 구본청사 팔각탑 전망 발코니 — 8/21(금) 18:00경, 1,200엔. 정원제 사전 예약 권장. 일반 관람(300엔)만으로도 충분하다.","【당일 확인 필수】 모이와산 로프웨이 운행 상태 — 8/23 오후에 mt-moiwa.jp에서 확인. 강풍·짙은 안개 시 운휴하거나 시야가 전혀 안 나온다. 안 되면 JR타워 T38(740엔, 실내, 최종 입장 21:30)로 전환.","【당일 확인 권장】 징기스칸 다루마 본점(8/21) — 연중무휴와 부정기 휴무로 자료가 상충한다. 닫혀 있으면 도보권의 4·4점 / 5·5점 / 6·4점 지점으로 이동.","【출발 전】 비지트재팬웹(Visit Japan Web) 등록 — 입국심사·세관신고 QR을 미리 발급받아 캡처. 2인 각각 등록해야 한다. 8/21 입국 줄을 크게 줄여준다.","【출발 전】 온라인 체크인 — 8/25 항공편. 신치토세공항은 2025년 11월부터 보안검색장 개보수 중이라 카운터 대기를 줄여두는 것이 중요하다.","【준비물】 컨택리스 신용/체크카드 각자 1장씩. 커플이 한 장을 공유하면 지하철 1일 상한요금 합산과 환승할인이 적용되지 않는다. 도산코패스·종이 승차권용 현금도 1인 1,000엔 정도.","【참고·예약 불가】 다루마 본점, 스아게+, 스미레, 사토 본점, 나나카마도, 기타이치홀, 모리히코 본점은 전부 워크인이다. 각 20~40분 대기를 일정에 반영했다."],"rainplan":["【8/21(금) 비】 거의 그대로 진행된다. 아카렌가는 실내 전시, 다루마·나나카마도는 실내, 타누키코지는 지붕 있는 아케이드다. 야외인 것은 노리아 관람차 하나뿐이고 관람차 자체도 밀폐형이라 비와 무관하다. 다만 야경이 흐리면 관람차 대신 JR타워 전망실 T38(740엔, 10:00~22:00, 최종 입장 21:30, 삿포로역 직결·완전 실내)로 대체할 것 — 160m로 삿포로 최고 높이인데 가장 싸다. 홋카이도대학 캠퍼스 산책은 비가 세면 통째로 빼고 그 시간을 숙소 얼리 체크인 문의에 쓰는 편이 낫다.","【8/22(토) 오타루가 비】 오타루는 실내 비중이 높아 코스 자체는 유지된다. 운하 산책 60분을 25분으로 줄이고, 그 시간을 기타이치 글라스 3호관(유리공예 매장 3개 관)과 기타이치홀 램프 카페에 더 줄 것. 운하 크루즈는 결항 가능성이 높으니 아예 빼고, 대신 르타오 본점 2F 카페(더블프로마주 + 창밖 메르헨 교차로 뷰)와 오타루 유리공예 체험(뷰티·글라스 만들기, 30~60분)으로 대체하면 오히려 비 오는 날 더 좋은 하루가 된다.","【8/23(일) 비 — 가장 쉬운 해법은 8/24와 통째로 맞바꾸는 것】 8/24가 실내 위주의 완충일이라, 두 날을 서로 바꾸면 별도 대안을 짤 필요가 없다. 단 하나 확인할 것은 키타카로 삿포로 본관 2F 카페가 화요일 휴무라는 점뿐인데, 8/23(일)·8/24(월) 둘 다 영업일이라 어느 쪽으로 옮겨도 문제가 없다. 모이와산만 날씨를 보고 다시 판단하면 된다.","【8/23(일) 비 — 날짜를 안 바꾸고 그날 안에서 해결하는 플랜】 홋카이도 신궁·마루야마공원을 빼고 실내로만 연결한다. 08:00 니조시장 아침(아케이드) → 모리히코 본점(실내 카페, 그대로 유지) → 시로이코이비토 파크(전 구간 실내, 시간을 3시간으로 늘림) → 도심 복귀 → 아카렌가 청사(8:45~21:00, 실내) → 다이마루/스텔라플레이스 지하 식품관 → 타누키코지 아케이드 → 오도리~스스키노 지하상가 폴타운 → 스미레. 지상 노출이 사실상 0이다.","【8/23(일) 밤 모이와산이 비/안개】 시야가 안 나오면 올라가는 의미가 없다. 취소하고 ① JR타워 T38(실내, 740엔) ② 노르베사 옥상 비어가든(15:00~23:30, 지붕 있음. 남·북측 모두 영업하는 것은 8/24까지) ③ 삿포로 팩토리 아트리움(실내몰) 중 선택. 이 경우 8/24 TV타워 슬롯을 그대로 살려두면 야경 경험은 유지된다.","【8/24(월) 비】 원래 실내 위주라 거의 그대로 간다. 키타카로 카페·다이마루·스아게+·타누키코지·카니혼케·TV타워가 전부 실내이거나 아케이드다. 빠지는 것은 오도리공원 옥수수 와곤 하나뿐인데, 옥수수는 TV타워 1층 주변이나 니조시장에서도 살 수 있다. 오히려 옵션으로 넣어둔 스스키노 천연온천 유코쿄를 살리기 가장 좋은 날이 된다.","【8/25(화) 비】 체크아웃 → 카페 → JR → 공항이 전부라 일정에 영향이 없다. 다만 캐리어를 끌고 젖은 길을 걷게 되므로 숙소에서 삿포로역까지는 택시(1,000~1,500엔)를 고려할 것.","【공통 우천 대체 카드】 타누키코지 아케이드(1km, 지붕), MEGA돈키호테 타누키코지 본점(24시간), 삿포로 팩토리(실내몰), 아카렌가 테라스, 다이마루 삿포로점·스텔라플레이스 지하 식품관, 오도리~스스키노 지하상가 폴타운, 시로이코이비토 파크, JR타워 T38, 삿포로 TV타워, 니조시장 노렌요코초.","【넣지 말 것】 삿포로 맥주박물관은 우천 대안으로도 추천하지 않는다 — '연중무휴'와 '매주 월요일 휴관'으로 공식·2차 자료가 정면 충돌하고, 최소한 유료 가이드 투어는 월요일 운휴가 확정이다. 8/24(월)은 물론이고 다른 날에 넣더라도 방문 당일 재확인이 필요하다. 야외 맥주는 삿포로 TV타워 비어가든(5/29~9/13, 12:00~21:30)이나 노르베사 옥상(~9/12)으로 대체하는 편이 안전하다.","【준비물】 접이식 우산 2개 필수. 비 오는 날은 오타루 돌바닥과 운하 산책로가 미끄러우니 밑창이 있는 스니커즈로."],"budget":"1인 약 66,000~99,000엔 (항공·숙박 제외 / 기념품 포함). 기념품을 빼면 약 51,000~69,000엔. 폭이 넓은 이유는 저녁 세 끼(하치쿄·마사즈시·카니혼케)의 등급 선택 때문이다.\n\n■ 교통 약 8,000엔\n공항 JR 왕복 2,460 + u시트 지정석 왕복 1,600 + 오타루 JR 왕복 1,600 + 지하철·시전차 약 2,400(8/23 도니치카 520 · 도산코 460 · 나머지 날은 개별 결제)\n\n■ 입장·체험 약 7,350엔\n아카렌가 300 + 노리아 관람차 800 + 오타루 운하 크루즈 1,800 + 모이와산 로프웨이 왕복 2,100 + 시계탑 350 + 시로이코이비토 파크 800 + TV타워 1,200\n· 【옵션 온천】 스스키노 천연온천 유코쿄는 일정상 21:50 입장이라 '야간온천'(21시 이후 접수) 요금 1,980엔이 적용된다. 통상 요금 2,750엔보다 770엔 싸다. 타월·배스타월·유카타 각 1매가 요금에 포함이라 몸만 가면 되고, 넣기로 하면 여기에 1인 1,980엔이 더해진다.\n\n■ 식비 약 36,000~54,000엔 (5일 10끼 + 카페 5회)\n8/21 삿포로역 점심 1,500~3,000 + 다루마 3,500~4,500 + 나나카마도 1,600~2,200\n8/22 스타벅스 700 + 마사즈시 4,000~6,000 + 기타이치홀 1,200 + 하치쿄 6,000~8,000 + 사토 1,700~2,200\n8/23 돈부리차야 2,500~3,500 + 모리히코 1,200~1,400 + 시로이코이비토 카페 800 + 스미레 1,100~1,500\n8/24 키타카로 2F 카페 세트 1,250 + 스아게+ 1,500~2,000 + 옥수수 400 + 카니혼케 6,000~14,000\n8/25 사루타히코 900~1,300\n→ 식비를 가르는 것은 사실상 세 끼다. 그중 카니혼케가 폭이 가장 커서, 최저 코스(6,000엔대)나 런치 회석으로 잡으면 전체 식비가 40,000엔 밑으로 내려간다. 나머지는 전부 1,000~3,500엔대 현지 인기점이라 조절 여지가 크지 않다.\n\n■ 기념품·쇼핑 15,000~30,000엔 (변동 큼)\n오타루 유리·오르골 2,000~4,000 + 타누키코지 드럭스토어 + 키타카로 1층 바움쿠헨 + 신치토세공항 국내선 2F 쇼핑월드 5,000~15,000\n\n■ 환전 팁\n카드 결제가 대부분 되지만 도니치카킷푸·도산코패스는 현금 전용이고 시장·노점(옥수수 와곤)도 현금이 편하다. 1인 현금 15,000~20,000엔 정도만 준비하고 나머지는 컨택리스 카드로.\n\n■ 【이 표의 신뢰도】 — 그대로 믿어도 되는 것과 확인이 필요한 것\n· [high] 유코쿄 온천 요금 — 공식 사이트(toukakyo.jp) 요금표를 직접 확인했다. 야간 1,980엔·통상 2,750엔, 타월·유카타 포함 모두 원문 기준이다.\n· [medium] 카니혼케 코스 가격 — 공식 도메인 직접 접속이 막혀 검색 결과로만 확인했다. '저녁 코스 6,000엔대부터, 런치 회석 3,700엔부터'라는 범위는 예약할 때 실제 코스표로 다시 볼 것.\n· [medium] 키타카로 2F 케이크 세트 1,250엔 — 공식 사이트 기준. 명물 슈크림·바움쿠헨은 1층에서 파는 별도 상품이라 카페 세트와는 다르다는 점만 알고 갈 것.\n· [low~medium] 모리히코 커피값 — 가장 최신 자료가 2022년이라 그 뒤 인상됐을 수 있다.\n· [medium] 삿포로역 레스토랑가 점심 1,500~3,000엔 — 대표 매장 몇 곳 기준의 대략치다. 다이마루 8층 고급 전문점을 고르면 1인 5,000엔에 근접한다.","risks":"■ [1] 마지막 날이 이 일정에서 가장 크게 좋아진 부분이다\n3박 4일 안이었을 때 마지막 날 아침은 06:15 체크아웃 → 07:45 열차 → 11:30 출발이었다. 성수기에 신치토세 국제선 보안검색장 개보수(2025/11~2027/12)까지 겹쳐, 이 일정에서 유일한 '비행기 놓침' 급 실패 지점이었다. 지금은 8/25(화) 12:55 출발로 바뀌면서 07:50 체크아웃 → 08:35 카페 → 09:40 열차 → 10:20경 공항 도착이 되고, 출발까지 2시간 30분 이상이 남는다. 새벽 기상도, 전날 택시 예약도 필요 없어졌다.\n→ 그래도 국제선 권장 도착 시각은 항공사 안내를 따를 것. 10:20경 도착이면 어떤 기준으로도 여유가 있다.\n\n■ [2] 가장 긴 하루는 8/22다 (08:20~22:30, 약 14시간)\n오타루 왕복에 저녁 하치쿄까지 넣은 대가다. 18:50~19:40 숙소 휴식 50분을 실제로 시간표에 박아 두었다. 체력이 부족하면 잘라낼 순서는 ① 오타루 운하 크루즈(45분) ② 사카이마치도리 산책 단축 ③ 오르골당 순이다.\n→ 8/23도 08:00~21:05로 짧지 않다. 이틀 연속 13~14시간이므로 8/24를 늦잠으로 시작하게 짜둔 것은 감성이 아니라 체력 계산이다. 8/24 오전을 앞당기고 싶은 유혹을 참을 것.\n\n■ [3] 오타루 복귀 — 판단 규칙 하나만 지키면 된다\n미나미오타루역은 보통열차가 주력이라 배차가 시간당 2~3편이다. 17:35까지 역에 도착했는데 다음 열차가 15분 이상 남았으면, 1정거장(4분) 타고 오타루역으로 나가 쾌속 에어포트(시간당 3편, 32~40분)로 갈아탈 것.\n→ 뒤에 하치쿄 19:40 예약이 걸려 있지만 사이에 숙소 휴식 50분이 완충으로 들어가 있어 30분쯤 밀려도 저녁을 놓치지 않는다. 하치쿄가 17:50이던 3박 4일 안보다 이 구간이 확실히 편해졌다.\n\n■ [4] 예약 실패 리스크는 두 곳뿐이다\n저녁 예약이 필요한 곳은 하치쿄(8/22)와 카니혼케(8/24) 둘이다. 나머지 저녁(다루마·스미레)은 워크인이고 L.O.가 늦어 실패해도 대체가 쉽다.\n· 하치쿄 실패 시 → 카니혼케를 8/22로 당기고, 8/24 저녁은 워크인 해산물집이나 노르베사 옥상 비어가든으로 돌린다.\n· 카니혼케 실패 시 → 8/24가 완충일이라 타격이 가장 작다. 게를 포기하고 니조시장 노렌요코초나 스스키노 워크인으로 대체하면 된다.\n\n■ [5] 정보 신뢰도가 낮아 사전·현지 재확인이 필요한 항목\n· [medium] 키타카로 삿포로 본관 2F 카페 — 공식 사이트 최신 공지(2026/7/1)에는 '매주 화요일 정기휴무, 11:00~16:00'로 명시돼 있는데, 같은 사이트 매장 소개 페이지에는 '2F 카페는 당분간 영업을 휴지합니다'라는 옛 문구가 지워지지 않고 남아 있어 서로 모순된다. 최신 공지 쪽이 맞다고 보고 8/24에 넣었지만 출발 직전에 공식 사이트나 전화(0800-500-0318)로 한 번 더 확인할 것. 8/25(화)은 휴무라 대체 날짜가 없다.\n· [medium] 오타루 운하 크루즈 요금·운항 시각표 — 날짜별로 편성되고 악천후에 결항한다. 요금 1,800엔은 일반 통용값이며 현장 게시 기준으로 확인.\n· [medium] 노리아 관람차 요금 800엔 — 현장 확인.\n· [medium] 다루마 본점 휴무 — '연중무휴'와 '부정기 휴무'가 상충한다. 본점 마감은 03:00(L.O. 02:30)이고 05:00은 지점 기준이다.\n· [medium] 사토 본점(월 1회 부정기 휴무), 나나카마도(부정기 휴무) — 서로를 대체재로 쓰면 된다.\n· [medium] 신치토세공항 국제선 보안검색 개보수에 따른 실제 권장 도착 시각 — 항공사 안내를 따를 것.\n· [일정에서 의도적으로 제외한 것] 스프카레 GARAKU 본점(2025년 이전 후 주소 자료가 상충해 스아게+로 대체), 니조시장 사카나야노다이도코로(부정기 휴무 + 영업시간 자료 상충), 삿포로 맥주박물관(월요일 휴관 여부 자료 정면 충돌).\n\n■ [6] 기대치 관리 — 미리 알고 가야 실망하지 않는다\n· 【축제 완전 공백기다】 2026 삿포로 여름축제·오도리 비어가든은 7/23~8/18, 타누키마츠리 ~8/18, 스스키노 마츠리 8/6~8로 전부 종료됐고, 오텀페스트는 9/11부터다. 8/19~9/10은 오도리공원 이벤트가 하나도 없는 구간이며 이번 여행 닷새가 그 한복판이다. '여름 삿포로 = 오도리공원 비어가든'을 기대했다면 지금 알아야 한다. 대체안: TV타워 비어가든(~9/13, 12:00~21:30, 오도리공원 안), 노르베사 옥상 비어가든(~9/12), 파크호텔 비어가든(~8/31, 호텔 폐관 예정이라 올해가 마지막).\n· 【반대급부】 오봉(8/13~16) 직후라 항공·숙박이 싸고 맛집 웨이팅이 성수기 대비 확실히 짧다. '축제 분위기 대신 여유를 산 것'이라는 트레이드오프다.\n· 【제철은 여름 홋카이도다】 우니는 어기 마지막 10일(요이치·샤코탄 모두 8/31 종료)이라 먹을 수 있지만 물량·시세 변동이 크고 파도가 있으면 당일 품절이 잦다. 옥수수·가리비·홋카이시마에비는 정점. 반면 가을 연어·이쿠라·꽁치는 9월부터라 아직 이르다. '가을 홋카이도'를 기대하면 안 된다.\n· 【8/23까지 방학】 삿포로 초·중학교 여름방학이 8/23까지다. 8/23(일)에 가는 시로이코이비토 파크는 방학 마지막 주말과 겹쳐 가족 단위로 붐빈다고 봐야 한다. 8/24부터 개학이라 월요일 아침 지하철이 혼잡해지는데, 우리는 8/24에 10:40부터 움직이므로 러시(07:30~08:30)를 완전히 피한다. 8/25 09:40 JR도 마찬가지다.\n\n■ [7] 자잘하지만 실제로 하루를 흔드는 것들\n· 미야노사와→스스키노는 실측 36~40분이다(도보 7 + 대기 4 + 승차 17 + 지하상가 도보 10). 30분으로 잡으면 8/23 저녁이 반드시 밀린다.\n· 8/23 점심은 11:50 모리히코 본점인데 푸드 메뉴가 가볍다. 배가 고프면 마루야마 상점가에서 간단히 요기하고 모리히코에서는 커피만 마실 것. 그리고 시로이코이비토 파크에서는 정식 식사를 하지 말 것 — 소프트크림·음료만. 두 끼를 2시간 간격으로 넣으면 한쪽이 통째로 버려진다.\n· 도자이선은 삿포로역에 들어오지 않는다. 마루야마·미야노사와는 반드시 오도리역에서 탈 것.\n· 커플이 카드 한 장을 공유하면 지하철 1일 상한요금 합산과 버스 환승할인이 적용되지 않는다. 각자 자기 카드로 태그할 것.\n· 【JR 삿포로역 개찰 안에는 먹을 곳이 없다】 신칸센 공사로 도토루(2025/9)·롯데리아(2025/12)가 폐점했고 파세오는 폐쇄 중(재개업 2028년 겨울). 8/25 아침을 개찰 밖 사루타히코 08:35로 잡아둔 이유가 이것이다. 더 이르게 움직여야 하면 스텔라플레이스 1F 스타벅스(07:00)를 쓸 것.\n· 시전차 막차가 22:30~23:00경이다. 8/23 모이와산은 상행 최종(21:30)을 지키는 것보다 하산 후 시전차를 놓치지 않는 것이 더 중요하니 21:40까지 하행을 탈 것.\n· 홋카이도대학 캠퍼스(은행나무길 北13, 포플러길 北18)는 8/21에 100분을 잡아 뒀다. 60분으로 줄이면 정문 근처만 보고 돌아 나와야 한다. 다만 8월에는 은행나무가 초록이라 흔히 보는 노란 터널 사진은 나오지 않는다는 점을 알고 갈 것.","days":[{"date":"2026-08-21","weekday":"금","theme":"도착일 — 11:50 착륙, 캠퍼스와 붉은 벽돌 그리고 스스키노의 첫 밤","noteA":"이스타 11:50 도착 기준. 13:15에 삿포로역이라 첫날이 반나절이 아니라 거의 온전한 하루가 된다. 짐은 삿포로역 코인로커에 맡기고 홋카이도대학으로 가는 것이 핵심.","items":[{"time":"11:50","title":"신치토세공항 도착 · 입국 수속","name_ja":"新千歳空港 到着・入国審査","kind":"이동","lat":42.787,"lng":141.6759,"duration_min":45,"cost":"-","desc":"이스타항공 09:20 인천 출발 → 11:50 신치토세 착륙. 입국심사와 수하물 수취에 성수기 기준 40~50분을 잡았다. 국제선 터미널에서 국내선 지하의 JR 신치토세공항역까지는 연결통로로 도보 7~10분.","tip":"비지트재팬웹(Visit Japan Web)에서 입국심사·세관신고를 출발 전에 미리 등록하고 QR을 저장해 둘 것 — 심사 줄이 확연히 짧아진다. 캡처해 두면 공항 와이파이가 느려도 쓸 수 있다.","short":"신치토세 도착"},{"time":"12:35","title":"신치토세공항 → JR 삿포로역 (쾌속 에어포트)","name_ja":"JR快速エアポート（新千歳空港駅→札幌駅）","kind":"이동","lat":43.0687,"lng":141.3508,"duration_min":40,"desc":"국제선 터미널에서 연결통로를 따라 국내선 지하의 JR 신치토세공항역까지 도보 7~10분, 이후 쾌속 에어포트로 삿포로역까지 37분. 10~15분 간격 운행이라 몇 편 놓쳐도 괜찮다.","cost":"1,230","tip":"편도 1,230엔이 2025/4/1 개정 후 현재 요금이다('1,150엔'은 옛 정보). 캐리어가 크면 4호차 u시트 지정석을 에키넷 티켓리스로 800엔에 예약해 둘 것 — 자유석은 캐리어 승객으로 만석이 되어 서서 가는 일이 흔하다.","short":"JR 삿포로역"},{"time":"13:20","title":"점심 — 삿포로역에서 첫 끼","name_ja":"JR札幌駅・ステラプレイス","kind":"식사","lat":43.068,"lng":141.351,"duration_min":45,"cost":"1,500~2,500","desc":"짐을 들고 있으니 역을 벗어나지 않는다. 스텔라플레이스 6층 레스토랑가나 다이마루 8층 레스토랑가가 무난하고, 가볍게 먹고 싶으면 지하 식품관에서 사서 앉아 먹어도 된다.","tip":"오늘 저녁이 징기스칸이니 점심은 양고기를 피할 것. 라멘·소바·정식 쪽이 맞다. 공항에서 먼저 먹고 싶어질 수 있는데, 신치토세 국내선 3층 식당가는 귀국일인 8/25 오전에도 들를 수 있으니 첫날은 시내로 바로 들어오는 편이 낫다.","optional":false,"short":"삿포로역 점심"},{"time":"14:05","title":"삿포로역 → 숙소 (짐 맡기러)","name_ja":"宿へ移動（荷物を預ける）","kind":"이동","lat":43.053,"lng":141.347,"duration_min":25,"cost":"210","desc":"지하철 남북선으로 삿포로역에서 스스키노까지 4분, 거기서 서쪽으로 도보 8분. 이번 여행에서 캐리어를 끌고 이동하는 사실상 유일한 구간이다.","tip":"체크인은 16:00이지만 짐은 13:00부터 맡길 수 있다고 확인됐다. 덕분에 삿포로역 코인로커가 필요 없어졌고, 밤에 짐을 찾으러 삿포로역으로 되돌아갈 일도 없어졌다.","optional":false,"short":"숙소로 이동"},{"time":"14:30","title":"숙소에 짐 맡기기","name_ja":"荷物を預ける（13:00〜）","kind":"휴식","lat":43.053,"lng":141.347,"duration_min":20,"cost":"-","desc":"캐리어를 내려놓고 저녁에 필요한 것만 챙겨 나온다. 밤에는 18~19℃까지 떨어지니 겉옷 한 벌은 반드시 이때 꺼내 들고 나갈 것.","tip":"정식 체크인은 16:00부터라 지금은 방에 들어가지 못할 수도 있다 — 호스트 안내를 따를 것. 짐만 두고 나가는 것이므로 세면·환복은 밤에 돌아와서 한다.","optional":false,"short":"짐 맡기기"},{"time":"14:50","title":"숙소 → 홋카이도대학","name_ja":"北海道大学へ移動","kind":"이동","lat":43.0756,"lng":141.3425,"duration_min":25,"cost":"210","desc":"숙소에서 스스키노역까지 도보 8분, 지하철 남북선으로 삿포로역 4분, 북쪽 출구에서 캠퍼스 정문까지 도보 10분.","tip":"짐을 맡기러 숙소를 한 번 왕복하는 대가로 45분쯤이 더 든다. 그 대신 캐리어 없이 캠퍼스를 걷고, 밤에 삿포로역으로 짐을 찾으러 가지 않아도 된다.","optional":false,"short":"홋대로 이동"},{"time":"15:15","title":"홋카이도대학 캠퍼스 산책","name_ja":"北海道大学 札幌キャンパス","kind":"관광","lat":43.0756,"lng":141.3425,"duration_min":95,"desc":"삿포로역 북쪽 출구에서 도보 10분. 포플러 가로수길과 은행나무 가로수길이 이어지는 캠퍼스로, 8월엔 완전한 초록 터널이다. 도착 첫날에 힘 빼지 않고 걷기 좋은 곳.","cost":"-","tip":"8월 은행나무는 초록이라 흔히 보는 노란 터널 사진은 안 나온다. 그걸 기대하지 말고 '여름 캠퍼스 산책'으로 생각할 것. 95분이면 정문에서 은행나무길을 지나 포플러길 초입까지다. 포플러길 안쪽까지 보고 싶으면 20분쯤 더 써도 된다 — 아카렌가는 21:00까지 열려 있어서 골든아워(18:15~18:45)만 지키면 뒤가 밀리지 않는다.","short":"홋카이도대학"},{"time":"16:50","title":"홋카이도대학 → 아카렌가 청사 (도보)","name_ja":"北海道庁旧本庁舎へ徒歩移動","kind":"이동","lat":43.0639,"lng":141.348,"duration_min":20,"cost":"-","desc":"캠퍼스 남쪽으로 나와 삿포로역 서쪽을 지나 도보 15~20분. 지하철을 탈 거리가 아니다.","tip":"다리가 무거우면 삿포로역에서 잠깐 앉았다 가도 된다. 아카렌가 도착이 17:10이라 골든아워까지 한 시간 여유가 있다.","optional":false,"short":"아카렌가로 도보"},{"time":"17:10","title":"홋카이도청 구본청사(아카렌가) 황혼 산책","name_ja":"北海道庁旧本庁舎（赤れんが庁舎）","kind":"관광","lat":43.064,"lng":141.348,"duration_min":130,"desc":"5년여의 대규모 개수를 마치고 2025년 7월 25일 리뉴얼 재개관한 붉은 벽돌 청사. 8:45~21:00(최종 입관 20:30)로 늦게까지 열려 도착일 저녁에 넣기 가장 좋다. 앞 연못에 청사가 통째로 반사되는 구도가 시그니처.","cost":"300","tip":"8/21 일몰은 18:29이고 18:15~18:45가 붉은 벽돌이 가장 예쁘게 물드는 골든아워다. 17:10에 도착하니 실내 전시(8:45~21:00, 최종 입관 20:30)를 먼저 둘러보고 그 시간에 맞춰 밖으로 나오면 순서가 딱 맞는다. 팔각탑 전망 발코니(1,200엔)는 정원제라 사전 예약이 필요하니 관심 있으면 미리 잡을 것.","short":"아카렌가 청사"},{"time":"19:20","title":"아카렌가 → 스스키노 (다루마 본점)","name_ja":"すすきのへ移動","kind":"이동","lat":43.05385,"lng":141.352456,"duration_min":20,"desc":"도보로 오도리공원을 가로질러 내려가면 약 1.3km·17분. 비가 오면 삿포로역에서 지하철 남북선으로 스스키노까지 4분.","cost":"-","tip":"도보 코스가 곧 오도리공원 야경 예고편이다. 시간이 남으면 TV타워 앞에서 사진 한 장.","short":"스스키노로"},{"time":"19:45","title":"저녁 — 징기스칸 다루마 본점","name_ja":"成吉思汗 だるま 本店","kind":"식사","lat":43.05385,"lng":141.352456,"duration_min":80,"desc":"1954년 창업, 삿포로 징기스칸의 원형. 카운터만 있는 작은 가게에서 생 양고기를 참숯불 위 볼록 냄비에 구워 특제 간장 다레에 찍어 먹는다. 첫 홋카이도라면 여기가 정답.","cost":"3,500~4,500","tip":"본점은 17:00~다음날 03:00(L.O. 02:30)이고 05:00 마감은 4·4점 등 지점 기준이다. 부정기 휴무 표기가 있어 당일 확인 권장. 워크인만 되고 20~40분 대기는 기본 — 대기가 길면 도보 3분의 '5·5점'이나 '6·4점' 지점으로 갈아타면 된다. 항공편이 2시간 밀려도 L.O.가 02:30이라 이 일정은 그대로 성립한다.","short":"다루마 징기스칸"},{"time":"21:10","title":"노리아 관람차 (노르베사 옥상)","name_ja":"観覧車nORIA（nORBESA）","kind":"야경","lat":43.0561,"lng":141.3509,"duration_min":30,"desc":"빌딩 옥상에 올라앉은 지름 45.5m 관람차. 한 바퀴 약 10분 동안 스스키노 네온 한복판을 둘이서만 밀폐된 곤돌라 안에서 내려다본다. 다루마에서 도보 5분.","cost":"800","tip":"금·토·공휴일 전날은 11:00~다음날 01:00 운행이라 8/21(금)은 시간 여유가 넉넉하다. 요금은 현장 게시 기준 확인. 같은 건물 옥상 비어가든(15:00~23:30)도 있으니 맥주 한 잔이 당기면 여기서.","short":"노리아 관람차"},{"time":"21:45","title":"타누키코지 상점가 · MEGA돈키호테 야간 산책","name_ja":"狸小路商店街・MEGAドン・キホーテ札幌狸小路本店","kind":"쇼핑","lat":43.057,"lng":141.3512,"duration_min":40,"desc":"1873년부터 이어진 1km 아케이드. 지붕이 있어 비가 와도 무관하고, MEGA돈키호테 본점은 24시간이라 밤에 훑기 좋다.","cost":"-","tip":"오늘은 '구경'만 하고 본격 기념품은 8/24 아침 신치토세공항 국내선 2F 쇼핑월드에서 몰아 살 것 — 종류가 더 많고 부피 관리도 쉽다. 여기서는 드럭스토어 화장품·현지 한정 과자 정도만.","short":"타누키코지"},{"time":"22:30","title":"시메파르페 — 밤파르페 전문점 나나카마도","name_ja":"夜パフェ専門店 ななかま堂","kind":"카페","lat":43.055593,"lng":141.350465,"duration_min":55,"desc":"삿포로에만 있는 '시메파르페' 문화(술 마신 뒤 라멘 대신 파르페로 마무리)의 대표 가게. 홋카이도 과일과 유제품으로 층을 쌓은 계절 파르페를 술 한 잔과 함께.","cost":"1,600~2,200","tip":"금·토·공휴일 전날은 18:00~다음날 02:00(L.O. 01:30)이라 늦어도 안전하다. 부정기 휴무가 있으니 닫혀 있으면 8/23에 갈 '사토 본점'과 순서를 맞바꾸면 된다.","short":"나나카마도"},{"time":"23:30","title":"숙소 복귀","name_ja":"宿（民泊）南5条西8丁目","kind":"휴식","lat":43.053,"lng":141.347,"duration_min":15,"desc":"전부 도보권이라 이동 부담이 없다. 내일은 08:20 출발이니 바로 취침.","cost":"-","tip":"피곤하면 관람차나 돈키호테 중 하나를 빼고 22:00에 파르페로 직행해도 하루가 완성된다. 첫날은 '무리하지 않는 것'이 다음 이틀을 살린다.","short":"숙소"}]},{"date":"2026-08-22","weekday":"토","theme":"오타루 하루 통째로 — 운하·스시·유리·오르골, 서두르지 않는 날","noteA":"3박4일이었다면 오타루 반나절에 모이와산 야경까지 붙여 14시간 강행군이 됐을 날이다. 하루가 늘면서 오타루만 온전히 쓰고 야경은 내일로 넘겼다.","items":[{"time":"08:20","title":"아침 — 스타벅스 삿포로 스텔라플레이스 센터 1층","name_ja":"スターバックス コーヒー 札幌ステラプレイス センター1階店","kind":"카페","lat":43.0679,"lng":141.351,"duration_min":40,"desc":"JR 삿포로역 개찰 밖 스텔라플레이스 1층. 07:00부터 열고 사실상 연중무휴라 오타루행 열차 전 아침으로 가장 확실하다.","cost":"700","tip":"[중요] 홋카이도 신칸센 연장 공사로 JR 삿포로역 '개찰 안'에는 음식점이 사실상 전멸했다(도토루·롯데리아 폐점, 파세오 폐쇄 중). 아침은 반드시 개찰 밖에서 해결할 것. 사루타히코 커피 D-LIFEPLACE(도보 5분)도 토요일 08:00부터 열지만 8/24 아침에 갈 예정이라 오늘은 스타벅스로.","short":"삿포로역 스타벅스"},{"time":"09:00","title":"JR 삿포로역 → 오타루역 (쾌속 에어포트)","name_ja":"JR快速エアポート（札幌駅→小樽駅）","kind":"이동","lat":43.1976,"lng":140.9939,"duration_min":45,"desc":"쾌속 에어포트로 32~40분. 낮 시간대 시간당 3편이라 배차 걱정이 없다. 오른쪽 창가에 앉으면 제니바코 구간에서 바다가 바로 옆으로 붙는다.","cost":"800","tip":"토요일이라 '일일산책킷푸'(2,730엔)도 쓸 수 있지만 오타루 왕복 1,600엔뿐이면 손해다. 그냥 편도씩 사거나 IC카드로 탈 것.","short":"JR 오타루행"},{"time":"09:45","title":"오타루 운하 산책 (아사쿠사바시~주오바시)","name_ja":"小樽運河","kind":"관광","lat":43.199,"lng":141.001,"duration_min":60,"desc":"오타루역에서 완만한 내리막을 따라 도보 12분이면 운하. 아사쿠사바시 전망 광장에서 운하와 석조 창고군이 한 프레임에 들어오는 정면 구도가 나오고, 주오바시 방향으로 산책로를 따라 걸으면 63개의 가스등이 이어진다.","cost":"-","tip":"오전 이 시간대가 인파가 가장 적어 사진이 깨끗하게 나온다. 오타루는 돌·요철 구간이 많으니 힐은 금물, 스니커즈로.","short":"오타루 운하"},{"time":"10:50","title":"운하 → 스시야도리 (도보)","name_ja":"小樽寿司屋通りへ徒歩移動","kind":"이동","lat":43.194175,"lng":141.000158,"duration_min":15,"desc":"운하에서 남서쪽으로 약 900m. 옛 은행 건물이 늘어선 이로나이 교차로를 지나 스시야도리로.","cost":"-","tip":"가는 길의 '구 홋카이도은행 오타루지점' 등 메이지·다이쇼기 석조 건물들이 그대로 남아 있다. 사진 찍으며 천천히 걸어도 15분이면 충분.","short":"스시야도리로"},{"time":"11:05","title":"점심 — 오타루 마사즈시 본점","name_ja":"おたる政寿司 本店","kind":"식사","lat":43.194175,"lng":141.000158,"duration_min":80,"desc":"1938년 창업, 오타루 스시야도리의 얼굴. 홋카이도 근해 제철 네타로 구성된 런치 니기리 세트가 가성비가 좋다. 8월 하순은 우니 어기 마지막 10일이라 생 우니를 노릴 수 있고, 소야산 껍질째 활가리비도 정점이다.","cost":"4,000~6,000","tip":"11:00 오픈이라 5분 전 도착이 정답 — 오픈런하면 대기가 없다. 런치 11:00~15:00(L.O.14:30). 정기휴무는 매주 수요일이라 8/22 토요일은 정상 영업. 예약이 되니 한국에서 미리 잡아두면 마음이 편하다.","short":"마사즈시"},{"time":"12:30","title":"스시야도리 → 운하 크루즈 승선장 (도보)","name_ja":"小樽運河クルーズ 乗船場へ徒歩移動","kind":"이동","lat":43.199938,"lng":141.001762,"duration_min":15,"desc":"주오바시 옆 크루즈 승선장까지 약 700m.","cost":"-","tip":"승선장에서 당일권을 살 수 있지만 8월 주말은 온라인 예약이 안전하다. 예약센터 09:30~20:00.","short":"승선장으로"},{"time":"12:50","title":"오타루 운하 크루즈 (데이크루즈)","name_ja":"小樽運河クルーズ（デイクルーズ）","kind":"관광","lat":43.199938,"lng":141.001762,"duration_min":45,"desc":"약 40분간 소형 보트로 운하 북운하 구간까지 왕복한다. 가이드가 오타루의 항만 역사를 설명해 주고, 물 위에서 올려다보는 석조 창고군은 산책로에서 보는 것과 완전히 다른 그림이다. 오전 내내 걸은 다리를 앉아서 쉬게 하는 구간이기도 하다.","cost":"1,800","tip":"[confidence medium] 운항 시각표가 날짜별로 편성되고 악천후 시 결항한다. 시간이 안 맞거나 비가 오면 통째로 빼고 사카이마치 산책과 기타이치홀에 시간을 더 줄 것 — 그래도 하루가 완성되게 짜 뒀다. 요금은 현장 게시 기준으로 확인.","short":"운하 크루즈"},{"time":"13:40","title":"크루즈 승선장 → 사카이마치도리 (도보)","name_ja":"堺町通り商店街へ徒歩移動","kind":"이동","lat":43.1925,"lng":141.006,"duration_min":15,"desc":"운하에서 남동쪽으로 약 1km. 사카이마치도리 북쪽 입구로 진입한다.","cost":"-","tip":"이 뒤로는 사카이마치도리 → 기타이치 글라스 → 오르골당(메르헨 교차로)이 한 줄로 이어지는 직선 동선이라 되돌아갈 일이 없다.","short":"사카이마치로"},{"time":"14:00","title":"사카이마치도리 상점가 산책","name_ja":"堺町通り商店街","kind":"쇼핑","lat":43.1925,"lng":141.006,"duration_min":100,"desc":"메이지·다이쇼기 상가 건물을 그대로 쓰는 약 900m 상점가. 유리공예점, 르타오 본점(더블프로마주), 기타카로, 롯카테이가 촘촘하다. 오타루 인생샷 구간이고, 4박5일이 되면서 여기에 100분을 줄 수 있게 됐다.","cost":"1,000~3,000","tip":"여자친구 원피스는 밝은 색으로 — 어두운 석조 건물 배경에 확실히 잘 산다. 유리공예 체험(뷰티 만들기 등)은 30~60분이 더 필요하니 하고 싶으면 오늘 크루즈를 빼고 그 시간을 쓸 것.","short":"사카이마치도리"},{"time":"15:45","title":"기타이치 글라스 3호관 · 기타이치홀 램프 카페","name_ja":"北一硝子三号館・北一ホール","kind":"카페","lat":43.192309,"lng":141.007317,"duration_min":55,"desc":"1891년 목조 창고를 개조한 홀 천장에 167개의 석유램프가 실제로 불을 밝히고 있다. 어둑한 홀에서 램프 빛만으로 마시는 커피와 케이크는 이번 여행에서 가장 '분위기'로 기억될 자리.","cost":"1,200","tip":"[중요] 기타이치홀의 식사 메뉴는 목·토·일에만 11:00~14:50 주문 가능하다 — 8/22 토요일이라 가능하지만 이미 스시를 먹었으니 음료·디저트로. 이 제약 때문에 오타루를 일부러 토요일에 배치했다. 3호관 자체는 9:00~18:00.","short":"기타이치홀"},{"time":"16:45","title":"오타루 오르골당 본관 · 증기시계","name_ja":"小樽オルゴール堂 本館","kind":"쇼핑","lat":43.190579,"lng":141.007792,"duration_min":45,"desc":"1912년 석조 창고 건물에 약 3만 8천 점의 오르골. 입구 앞 캐나다제 증기시계는 15분마다 증기로 기적을 울린다. 커플 이름을 새겨주는 오르골 각인 서비스가 있어 기념품으로 좋다.","cost":"2,000~4,000","tip":"9:00~18:00 연중무휴. 참고로 2026/7/17~8/29 기간의 금·토·공휴일 전날은 본관 1F가 야간 연장영업을 하지만 우리는 낮에 본다. 메르헨 교차로가 곧 미나미오타루역 방향이라 여기서 자연스럽게 귀로.","short":"오르골당"},{"time":"17:35","title":"미나미오타루역 → JR 삿포로역","name_ja":"南小樽駅 → 札幌駅","kind":"이동","lat":43.0687,"lng":141.3508,"duration_min":70,"desc":"메르헨 교차로에서 미나미오타루역까지 도보 8~10분(약간 오르막). 보통열차로 삿포로까지 약 50분.","cost":"800","tip":"[판단 규칙] 미나미오타루는 보통열차가 주력이라 배차가 시간당 2~3편이다. 역에 도착했는데 다음 열차가 15분 이상 남았으면 1정거장(4분) 타고 오타루역으로 나가 쾌속 에어포트(시간당 3편, 32~40분)로 갈아타는 편이 빠르다. 오늘은 저녁 예약이 걸려 있으니 15:45을 넘기면 무조건 이 규칙을 적용할 것.","short":"JR 삿포로행"},{"time":"18:50","title":"숙소 휴식","name_ja":"宿（民泊）南5条西8丁目","kind":"휴식","lat":43.053,"lng":141.347,"duration_min":40,"desc":"오타루에서 많이 걸었으니 저녁 전에 한 번 앉는다. 짐을 두고 가볍게 나온다.","cost":"-","tip":"4박5일이라 오늘 밤에 모이와산을 넣지 않았다. 야경은 내일(8/23) 저녁으로 미뤄서 오타루 하루를 온전히 쓰는 대신 밤을 가볍게 마무리한다.","short":"숙소"},{"time":"19:40","title":"저녁 — 우미아지 하치쿄 본점 (츳코메시)","name_ja":"海味 はちきょう 本店","kind":"식사","lat":43.056365,"lng":141.354,"duration_min":95,"desc":"홋카이도 어부 요리 이자카야. 명물 '츳코메시(つっこ飯)'는 점원이 \"옷쏘이!\" 구호에 맞춰 손님이 그만 외칠 때까지 밥그릇에 이쿠라를 퍼붓는 퍼포먼스다. 가게 전체가 같이 소리를 지르는 구조라 커플 여행 하이라이트 영상이 여기서 나온다.","cost":"6,000~8,000","tip":"[예약 필수] 8월 성수기 토요일 저녁은 워크인이 사실상 불가능하다. 한국에서 미리 예약할 것. 토요일 18:00~24:00(요리 L.O. 23:00). 츳코메시는 인원수만큼 시킬 필요 없이 1~2개면 충분하고, 나머지는 홋카이시마에비·활가리비 같은 8월 제철로 채우면 된다.","short":"하치쿄"},{"time":"21:25","title":"시메파르페 — 파르페, 커피, 술, 사토 본점","name_ja":"パフェ、珈琲、酒、佐藤 本店","kind":"카페","lat":43.059196,"lng":141.355376,"duration_min":55,"desc":"삿포로 시메파르페 문화를 전국구로 만든 가게. 계절 과일과 아이스크림, 젤라틴, 술을 층층이 쌓아 잔 안에서 온도와 식감이 계속 바뀌게 설계한 파르페를 낸다. 여행의 마지막 밤을 닫는 자리.","cost":"1,700~2,200","tip":"2024년 다누키코지에서 남1조서2(木NINARU빌딩)로 이전했으니 옛 주소로 가면 안 된다. 일요일은 13:00~24:00이고 월 1회 부정기 휴무가 있다. 닫혀 있으면 나나카마도(일요일 18:00~24:00)로 — 8/21에 이미 갔다면 에비소바 이치겐 총본점(~03:00)에서 새우라멘으로 마무리해도 좋다.","short":"사토 본점"},{"time":"22:30","title":"숙소 복귀","name_ja":"ホテルへ戻る","kind":"휴식","lat":43.053,"lng":141.347,"duration_min":15,"cost":"-","desc":"스스키노에서 도보 8분. 내일은 08:00 니조시장 아침이니 일찍 잔다.","tip":"","optional":false,"short":"숙소"}]},{"date":"2026-08-23","weekday":"일","theme":"서쪽으로 — 신궁·마루야마·모리히코, 그리고 모이와산 야경","noteA":"도심에서 서쪽으로 갔다가 되감아 오는 한 방향 동선이다. 마루야마 산책 뒤 모리히코 커피에서 앉는 구간이 오늘의 쉼표다.","items":[{"time":"08:00","title":"아침 — 돈부리차야 삿포로 니조시장점","name_ja":"どんぶり茶屋 さっぽろ二条市場店","kind":"식사","lat":43.0583,"lng":141.3586,"duration_min":50,"desc":"1903년부터 이어진 니조시장 안의 해산물덮밥 전문점. 우니·이쿠라·게·연어알을 원하는 조합으로 얹는 '와가마마동(제멋대로 덮밥)'이 대표. 07:30 오픈이라 사람이 몰리기 전에 앉을 수 있다.","cost":"2,500~3,500","tip":"4/1~10/31 하계 07:30~16:30(L.O.16:00), 연중무휴(1/1만 휴무)라 일요일 확실히 영업. 8월 하순은 요이치·샤코탄 우니 어기(8/31 종료) 마지막 10일이니 '生うに(명반 무첨가)' 표기를 확인하고 시가로 주문할 것. 파도가 있으면 당일 품절이 잦으니 대안으로 이쿠라·활가리비 조합을 생각해 둘 것.","short":"니조시장"},{"time":"08:55","title":"니조시장 → 삿포로 시계탑 (도보)","name_ja":"札幌市時計台へ徒歩移動","kind":"이동","lat":43.0625,"lng":141.3536,"duration_min":12,"desc":"약 600m, 창성천 공원을 지나 북서쪽으로.","cost":"-","tip":"가는 길에 니조시장 건어물·멜론 가게를 한 바퀴 훑어도 좋다. 8월 하순은 유바리 멜론은 끝물이지만 후라노 멜론이 아직 나온다.","short":"시계탑으로"},{"time":"09:10","title":"삿포로 시계탑","name_ja":"札幌市時計台","kind":"관광","lat":43.0625,"lng":141.3536,"duration_min":30,"desc":"1878년 삿포로농학교 연무장으로 지어진 국가 중요문화재. 2층 홀에 클라크 박사 관련 전시가 있고, 지금도 하워드사 시계가 기계식으로 작동한다.","cost":"350","tip":"[8/24 회피 대상] 공식 사이트 기준 휴관은 1/1~1/3뿐이고 '6~10월 넷째 월요일 휴관' 규정은 폐지됐지만, 자료가 여전히 엇갈려 8/24(8월 넷째 월요일)를 피해 일요일로 옮겼다. 정면 사진은 건물 안이 아니라 길 건너 전용 촬영대에서 찍는 것이 정석.","short":"시계탑"},{"time":"09:45","title":"시계탑 → 오도리역 → (도자이선) 마루야마코엔역 → 홋카이도 신궁","name_ja":"北海道神宮へ移動（地下鉄東西線 円山公園駅経由）","kind":"이동","lat":43.0543,"lng":141.3075,"duration_min":35,"desc":"시계탑에서 오도리역까지 도보 8분, 도자이선으로 마루야마코엔역까지 5분, 하차 후 마루야마공원을 가로질러 신궁 본전까지 도보 12~15분.","cost":"210","tip":"[함정] 도자이선은 삿포로역에 들어오지 않는다. 반드시 오도리역에서 탈 것. 일요일이라 도니치카킷푸 520엔(현금 매표기 구매) 또는 컨택리스 카드 터치(토·일 520엔 상한)로 하루 종일 커버된다.","short":"신궁으로"},{"time":"10:25","title":"홋카이도 신궁","name_ja":"北海道神宮","kind":"관광","lat":43.0543,"lng":141.3075,"duration_min":45,"desc":"1869년 창건된 홋카이도 총진수. 18만㎡ 원시림에 둘러싸여 있어 도심에서 15분 거리인데 공기가 완전히 다르다. 커플 참배와 오미쿠지, 고슈인(주인장)을 받기 좋은 자리.","cost":"-","tip":"4~10월은 6:00 개문 / 17:00 폐문, 授与所·고슈인은 9:00부터. 경내 '롯카테이 진구차야'에서 무료 차와 함께 파는 갓 구운 '호안기 모찌'는 당일 소비 한정이라 여기서만 먹을 수 있다 — 참배 후 하나씩.","short":"홋카이도 신궁"},{"time":"11:15","title":"마루야마공원 산책","name_ja":"円山公園","kind":"관광","lat":43.0514,"lng":141.3073,"duration_min":30,"desc":"신궁과 이어진 원시림 공원. 8월 하순의 짙은 초록 터널을 천천히 걷는 구간이다. 24시간 개방.","cost":"-","tip":"신궁 → 공원 → 마루야마코엔역이 한 방향이라 되돌아갈 일이 없다. 더우면 나무 그늘 벤치에서 10분 쉬어갈 것.","short":"마루야마공원"},{"time":"11:50","title":"점심 겸 커피 — 모리히코 본점","name_ja":"珈琲 森彦 本店","kind":"카페","lat":43.0533,"lng":141.3186,"duration_min":70,"cost":"1,000~1,800","desc":"전후 직후에 지어진 소박한 목조 가옥을, 1996년 창업하면서 3년에 걸쳐 직접 손봐 되살린 집. 담쟁이 덮인 붉은 함석지붕 2층집이고, \"공상하려면 높은 천장이 필요하다\"며 뚫어놓은 층고가 이 집의 인상을 만든다. 골목 안이라 모르면 못 찾는 자리인데 그게 이 집의 매력이다.","tip":"테이블이 6개뿐인 아주 작은 집이다 — 공식 안내에도 5인 테이블은 없고 4명까지만 받는다고 적혀 있다. 대기가 붙으면 이름 적어두고 마루야마 상점가를 한 바퀴 돌다 와도 된다. 영업시간은 공식 공지에서도 9:00~18:00과 9:00~19:00이 번갈아 걸릴 만큼 자주 바뀌니 가기 전에 morihico.com에서 확인할 것. 푸드가 가벼우니 배가 고프면 근처에서 먼저 요기하고 커피만 마시는 편이 낫다.","optional":false,"short":"모리히코 커피"},{"time":"13:05","title":"마루야마코엔역 → 미야노사와역 → 시로이코이비토 파크","name_ja":"白い恋人パークへ移動（地下鉄東西線 宮の沢駅）","kind":"이동","lat":43.0887,"lng":141.2717,"duration_min":35,"desc":"공원에서 마루야마코엔역까지 도보 8분, 도자이선 종점 미야노사와역까지 11분, 하차 후 도보 7분.","cost":"-","tip":"도니치카킷푸/카드 상한 안이라 추가 요금이 없다. 도자이선 종점이라 자리에 앉아 갈 수 있다.","short":"미야노사와로"},{"time":"13:45","title":"시로이코이비토 파크","name_ja":"白い恋人パーク","kind":"관광","lat":43.0887,"lng":141.2717,"duration_min":105,"desc":"이시야제과의 '시로이 코이비토' 공장을 유럽풍 테마파크로 만든 곳. 실제 생산 라인 견학, 장미 정원, 카라쿠리 시계탑(정시 퍼포먼스), 그리고 커플 사진이 잘 나오는 벽돌 건물군. 전 구간 실내·반실내라 비가 와도 그대로 진행된다.","cost":"800","tip":"[중요] 여기서는 점심을 먹지 말 것 — 소프트크림·음료·구운 과자 정도만. 오늘의 정식 점심은 14:25 스아게+다. 10:00~18:00(유료구역 최종 접수 16:30), 연중무휴. 쿠키 만들기 체험은 정원제라 사전 예약 권장. 8/23까지 삿포로 학교가 방학이라 일요일 낮은 가족 단위로 붐빈다.","short":"시로이코이비토"},{"time":"15:35","title":"미야노사와역 → 오도리역 → 스스키노 (도자이선 + 지하상가 도보)","name_ja":"すすきのへ移動（東西線＋地下街ポールタウン）","kind":"이동","lat":43.055789,"lng":141.351279,"duration_min":40,"desc":"파크에서 미야노사와역 도보 7분 + 대기 4분 + 도자이선 승차 17분 + 오도리에서 지하상가 폴타운을 통해 스스키노까지 도보 10분.","cost":"-","tip":"실측 기준 36~40분이 걸리는 구간이라 30분으로 잡으면 반드시 밀린다. 오도리↔스스키노는 지하상가로 이어져 있어 지하철을 한 번 더 탈 필요가 없다(비가 와도 젖지 않는다).","short":"도심 복귀"},{"time":"16:20","title":"숙소 휴식","name_ja":"宿（民泊）南5条西8丁目","kind":"휴식","lat":43.053,"lng":141.347,"duration_min":70,"desc":"모이와산은 산정이 시내보다 3~5℃ 낮다. 겉옷을 챙기고 잠깐 쉬었다 나간다.","cost":"-","tip":"모이와산 로프웨이 운행 상태를 지금 mt-moiwa.jp에서 확인할 것. 강풍·짙은 안개면 올라가도 아무것도 안 보인다. 안 되면 오늘 밤은 JR타워 T38(740엔, 실내, 최종 입장 21:30)로 바꾸면 된다.","short":"숙소"},{"time":"17:35","title":"저녁 — 스미레 삿포로 스스키노점","name_ja":"すみれ 札幌すすきの店","kind":"식사","lat":43.0563,"lng":141.3538,"duration_min":65,"desc":"삿포로 미소라멘의 원류로 꼽히는 집. 라드층이 두껍게 덮여 마지막 한 젓가락까지 뜨겁고, 진한 된장 국물에 굵은 곱슬면이 감긴다. TV타워에서 도보 10분.","cost":"1,100~1,500","tip":"11:00~24:00 연중무휴(일부 자료의 '일요일 휴무'·'평일 17:00 시작'은 오정보). 라드 때문에 국물이 식지 않으니 첫 한 입은 반드시 조심할 것. 콘·버터 토핑이 정석이고, 여름엔 '카라미소'도 좋다.","short":"스미레"},{"time":"18:50","title":"시전차 스스키노 → 로프웨이이리구치 + 무료 셔틀버스","name_ja":"市電すすきの停留場 → ロープウェイ入口停留場 + 無料シャトルバス","kind":"이동","lat":43.031784,"lng":141.333267,"duration_min":45,"desc":"하치쿄에서 시전차 스스키노 정류장까지 도보 3분. 시전차로 '로프웨이이리구치'까지 약 25분, 하차 후 로프웨이 산로쿠역행 무료 셔틀버스로 5분.","cost":"230","tip":"시전차는 균일 230엔. 토요일이라 도산코패스(460엔, 현금 구매만) 또는 크레카 터치(토·일 460엔 상한)로 왕복이 자동 커버된다. 셔틀을 놓쳐도 서쪽으로 도보 500m면 산로쿠역이다.","short":"모이와산으로"},{"time":"19:40","title":"모이와산 로프웨이 · 산정 전망대 야경","name_ja":"札幌もいわ山ロープウェイ","kind":"야경","lat":43.031784,"lng":141.333267,"duration_min":80,"desc":"산로쿠역에서 로프웨이 5분 + 모리스카(미니케이블카) 2분으로 해발 531m 산정. 이시카리 평야에 격자로 깔린 삿포로 야경이 발밑에서 지평선까지 펼쳐진다. 전망대는 '연인의 성지'로 지정돼 있어 '행복의 종'과 사랑의 자물쇠가 있다.","cost":"2,100","tip":"하계(4~11월) 로프웨이 10:30~22:00, 상행 최종 21:30(티켓은 21:25까지), 15분 간격. 왕복 2,100엔이며 '1,800엔'은 옛 정보다. 2026년 7월에 미니케이블카 고장으로 휴업한 이력이 있으니 당일 오후 mt-moiwa.jp에서 운행 상태를 반드시 확인할 것. 좌표는 산로쿠역(中央区伏見5-3-7) 기준 — 인터넷에 도는 산정 좌표로 내비를 찍으면 도로가 없는 지점으로 안내한다.","short":"모이와산 야경"},{"time":"21:05","title":"모이와산 → 숙소 복귀","name_ja":"宿（民泊）南5条西8丁目","kind":"이동","lat":43.053,"lng":141.347,"duration_min":45,"desc":"하행 로프웨이 → 무료 셔틀 → 시전차로 스스키노까지.","cost":"230","tip":"하행 로프웨이는 22:00까지지만 시전차 막차가 22:30~23:00경이다. 상행 최종을 놓치지 않는 것보다 하산 후 시전차를 놓치지 않는 것이 더 중요하니 늦어도 21:40까지는 하행을 탈 것. 놓치면 택시로 시내까지 3,000엔 전후.","short":"숙소로"}]},{"date":"2026-08-24","weekday":"월","theme":"도시에서 느리게 — 늦잠, 안도 다다오의 서가, 게 요리, 그리고 옵션 온천","noteA":"월요일 휴무를 전부 피해서 짠 하루다. 09:30에 시작하고 오후에 100분을 통째로 비워 뒀다. 밤에 스스키노 천연온천이 옵션으로 붙어 있고, 온천을 제대로 하고 싶으면 이 하루를 조잔케이로 바꾸면 된다.","items":[{"time":"09:30","title":"늦잠 · 숙소에서 천천히","name_ja":"ゆっくり起きる","kind":"휴식","lat":43.053,"lng":141.347,"duration_min":60,"cost":"-","desc":"오늘은 일부러 아무것도 잡지 않은 아침이다. 3일 내내 걸었으니 늦게 일어나서 씻고 천천히 나선다. 첫 일정이 11시라 서두를 이유가 없다.","tip":"오늘이 8/24 월요일이다. 월요일 휴무 시설을 피해서 짠 하루라 여유롭게 움직여도 어긋날 일이 없다. 참고로 삿포로 맥주박물관은 자유견학은 되지만 가이드 투어가 월요일 운휴이고 자료도 엇갈려서 아예 넣지 않았다.","optional":false,"short":"숙소"},{"time":"10:40","title":"숙소 → 키타카로 삿포로 본관","name_ja":"北菓楼 札幌本館へ移動","kind":"이동","lat":43.0619,"lng":141.3488,"duration_min":20,"cost":"210","desc":"지하철 남북선 스스키노→오도리 2분, 오도리역에서 북쪽으로 도보 8분. 아카렌가 청사 바로 앞이다.","tip":"","optional":false,"short":"키타카로로"},{"time":"11:00","title":"키타카로 삿포로 본관 — 안도 다다오의 건물에서 브런치","name_ja":"北菓楼 札幌本館","kind":"카페","lat":43.0619,"lng":141.3488,"duration_min":75,"cost":"1,000~1,800","desc":"1926년 도립도서관 건물을 안도 다다오가 리노베이션한 곳. 2층 카페는 천장까지 닿는 책장이 벽을 두르고 있어서 삿포로 도심에서 가장 조용하고 예쁜 자리로 꼽힌다. 명물 슈크림과 바움쿠헨을 커피와 함께.","tip":"2층 카페는 11:00~16:00(식사 L.O. 14:00), 정기휴무가 매주 화요일이라 오늘 월요일은 정상 영업이다. 반대로 마지막 날 8/25(화)에는 닫으니 오늘 아니면 기회가 없다. 1층 매장에서 기념품용 바움쿠헨도 같이 사두면 좋다.","optional":false,"short":"키타카로 본관"},{"time":"12:30","title":"다이마루 삿포로 · 스텔라플레이스 쇼핑","name_ja":"大丸札幌店・ステラプレイス","kind":"쇼핑","lat":43.0676,"lng":141.3495,"duration_min":80,"cost":"자유","desc":"삿포로역 직결. 다이마루 지하 식품관은 홋카이도 과자·반찬·디저트가 총집합이고, 스텔라플레이스는 의류·잡화 위주다. 비가 와도 전부 실내로 이어진다.","tip":"기념품 본격 구매는 마지막 날 신치토세공항 국내선 2층이 종류도 많고 부피 관리도 쉽다. 여기서는 공항에 없는 것(다이마루 지하 한정 디저트, 백화점 전용 브랜드) 위주로만 볼 것.","optional":false,"short":"다이마루·스텔라"},{"time":"13:55","title":"점심 — 수프카레 스아게 플러스 본점","name_ja":"soup curry Suage+ 本店","kind":"식사","lat":43.055789,"lng":141.351279,"duration_min":65,"desc":"오늘의 단일 정식 점심. 삿포로 발상의 스프카레 대표 주자로, 시그니처는 꼬치에 꽂아 숯불에 구운 '라무네 치킨'과 계절 홋카이도 채소. 국물은 맑고 향신료 향이 또렷하다.","cost":"1,500~2,000","tip":"일요일 11:00~21:00 연중무휴. 오후 2시 반은 피크가 지나 대기가 짧다. 매운맛은 1~10번 중 3~4번이 한국인 기준 딱 맞고, 밥은 소·중·대 중 '중'이면 충분. 참고로 유명한 GARAKU 본점은 2025년 10월 이전해 주소 혼선이 크므로 이번 일정에서는 뺐다.","short":"스아게+"},{"time":"15:10","title":"타누키코지 상점가 · MEGA돈키호테 (가볍게)","name_ja":"狸小路商店街・MEGAドン・キホーテ","kind":"쇼핑","lat":43.057,"lng":141.3512,"duration_min":75,"desc":"1km 아케이드를 오늘은 제대로 훑는다. 지붕이 있어 비가 와도 무관하고 MEGA돈키호테 본점은 24시간이다. 드럭스토어 화장품·의약품, 현지 한정 과자는 여기가 제일 싸다.","cost":"-","tip":"기념품 본구매는 내일 아침 신치토세공항 국내선 2F 쇼핑월드에서 몰아 할 것 — 시로이코이비토·롯카테이·기타카로·로이스가 다 모여 있고 부피 관리가 훨씬 쉽다. 여기서는 공항에 없는 드럭스토어 물건만.","short":"타누키코지"},{"time":"16:35","title":"숙소 휴식","name_ja":"宿でひと休み","kind":"휴식","lat":43.053,"lng":141.347,"duration_min":100,"cost":"-","desc":"오늘의 핵심이다. 산 것들을 정리하고 100분을 통째로 비워 둔다. 낮잠을 자도 되고 밀린 사진을 정리해도 된다.","tip":"이 블록을 지키는 게 오늘을 \"유유자적한 하루\"로 만드는 유일한 장치다. 시간이 남는다고 일정을 더 밀어 넣으면 어제와 똑같은 날이 된다.","optional":false,"short":"숙소"},{"time":"18:20","title":"저녁 — 삿포로 카니혼케 삿포로에키마에 본점","name_ja":"札幌かに本家 札幌駅前本店","kind":"식사","lat":43.0657,"lng":141.3526,"duration_min":95,"cost":"8,000~15,000","desc":"홋카이도 여행의 마지막 제대로 된 저녁. 털게·왕게·대게를 코스로 내는 노포로, 개별 좌식 룸이라 둘이 조용히 먹기 좋다. 4일 동안 양고기·스시·해산물덮밥·라멘을 지나왔으니 게로 마무리한다.","tip":"11:30~22:00, 연중무휴. 8월 성수기 저녁은 예약이 안전하다 — 공식 사이트나 구르나비에서 한국에서도 잡을 수 있다. 코스가 부담되면 단품 조합이나 런치 회석(3,700엔~)으로도 충분하다. 삿포로역 도보 3분이라 접근도 쉽다.","optional":false,"short":"카니혼케"},{"time":"20:00","title":"오도리공원 산책 + 옥수수 와곤(야키토키비)","name_ja":"大通公園・とうきびワゴン","kind":"관광","lat":43.0604,"lng":141.3524,"duration_min":45,"desc":"동서 1.5km 도심 공원을 서쪽에서 동쪽 TV타워 방향으로 천천히 걷는다. 분수와 조각, 그리고 3정목·4정목의 명물 옥수수 와곤.","cost":"400","tip":"홋카이도 옥수수 제철이 7월 중순~9월 중순이고 8월 하순이 정점 — 이 시기에만 냉동이 아닌 생 옥수수를 구워준다. 구운 것(야키)과 삶은 것(유데) 둘 다 있으니 하나씩 사서 나눠 먹을 것. 3정목 와곤은 9:00~19:00(우천에도 영업), 4정목은 17:00 마감·우천 휴업.","short":"오도리공원"},{"time":"20:50","title":"삿포로 TV타워 전망대","name_ja":"さっぽろテレビ塔","kind":"야경","lat":43.0611129,"lng":141.3564484,"duration_min":50,"desc":"높이 90.38m 전망대에서 오도리공원이 일직선으로 뻗어나가는, 삿포로에서 가장 유명한 구도를 본다. 오도리역에서 도보 1분.","cost":"1,200","tip":"8/23 일몰은 18:25. 18:15에 올라가면 석양 → 박명 → 완전한 야경으로 바뀌는 전 과정을 한 자리에서 본다(야경 스팟 중 이 '전환'을 볼 수 있는 곳은 여기뿐이다). 9:00~22:00, 최종 입장 21:50. 2026년 휴관일은 4/8·11/11 이틀뿐이라 오늘은 확실히 영업.","short":"TV타워"},{"time":"21:50","title":"[옵션] 스스키노 천연온천 유코쿄","name_ja":"すすきの天然温泉 湯香郷","kind":"온천","lat":43.052,"lng":141.3518,"duration_min":90,"cost":"입욕료 현장 확인","desc":"숙소에서 도보 10분, 스스키노 한복판 자스맥플라자 안에 있는 진짜 천연온천이다. 빌딩 사이로 열린 노천탕이 있고 사우나와 휴게 공간도 넓다. 조잔케이까지 왕복 3시간을 쓰지 않고도 홋카이도 온천을 한 번 하고 가는 방법.","tip":"10:00~24:00, 최종 접수 23:00, 연중무휴. 타월·배스타월·유카타 각 1매가 입욕료에 포함이라 몸만 가면 된다. 21시 이후 접수는 '야간온천' 요금이라 1,980엔으로, 통상 2,750엔보다 싸다 — 21:50 입장인 이 일정에 그대로 적용된다. 피곤하면 통째로 빼고 바로 들어가 자도 되는, 말 그대로 옵션이다.","optional":true,"short":"유코쿄 온천"},{"time":"23:30","title":"숙소 복귀","name_ja":"ホテルへ戻る","kind":"휴식","lat":43.053,"lng":141.347,"duration_min":15,"cost":"-","desc":"온천을 건너뛰면 22시 전에 들어와 짐을 미리 싸도 좋다. 내일은 07:50 체크아웃이다.","tip":"","optional":false,"short":"숙소"}]},{"date":"2026-08-25","weekday":"화","theme":"출국일 — 07:50 체크아웃, 새벽 기상 없는 마지막 아침","noteA":"12:55 출발이라 아침을 제대로 먹고 공항 쇼핑까지 여유 있게 소화한다. 관광시설은 하나도 넣지 않았다.","items":[{"time":"07:50","title":"숙소 체크아웃 · 짐 정리","name_ja":"チェックアウト","kind":"이동","lat":43.053,"lng":141.347,"duration_min":40,"cost":"-","desc":"4박을 보낸 숙소를 정리하고 나선다. 12:55 출발이라 새벽에 일어날 필요가 전혀 없다.","tip":"에어비앤비 체크아웃 절차(열쇠 반납 위치, 쓰레기 처리)를 전날 밤에 확인해 둘 것. 짐이 크면 스스키노역 엘리베이터 위치도 미리 봐 두면 좋다.","optional":false,"short":"숙소 체크아웃"},{"time":"08:35","title":"아침 — 사루타히코 커피 D-LIFEPLACE 삿포로","name_ja":"猿田彦珈琲 D-LIFEPLACE札幌","kind":"카페","lat":43.0653,"lng":141.3504,"duration_min":55,"cost":"900~1,300","desc":"삿포로역에서 도보 5분. 07:00부터 열고 모닝 메뉴가 11:00까지라 마지막 아침을 제대로 앉아서 먹을 수 있다. 토스트와 스페셜티 커피로 여행을 닫는다.","tip":"[함정] 신칸센 공사로 JR 삿포로역 개찰 안에는 먹을 곳이 사실상 없다 — 도토루(2025/9)·롯데리아(2025/12) 폐점, 파세오는 2028년 겨울까지 폐쇄. \"역에서 대충 먹지\"는 실패한다. 대안은 스텔라플레이스 1층 스타벅스(07:00, 개찰 밖).","optional":false,"short":"사루타히코 커피"},{"time":"09:40","title":"JR 쾌속 에어포트 — 삿포로역 → 신치토세공항","name_ja":"JR快速エアポート（札幌駅→新千歳空港駅）","kind":"이동","lat":42.7876,"lng":141.6814,"duration_min":45,"cost":"1,230 (+u시트 800)","desc":"10~15분 간격이라 한 편 놓쳐도 문제없다. 공항역은 국내선 터미널 지하에 직결된다.","tip":"u시트 지정석(4호차)을 에키넷 티켓리스로 1인 800엔에 예약해 두면 캐리어를 두고 앉아 갈 수 있다. 화요일 오전이라 월요일 아침만큼 붐비지는 않는다.","optional":false,"short":"공항으로"},{"time":"10:30","title":"국내선 2F 쇼핑월드 — 기념품 마무리","name_ja":"新千歳空港 国内線2F ショッピングワールド","kind":"쇼핑","lat":42.7876,"lng":141.6814,"duration_min":70,"cost":"5,000~15,000","desc":"시로이코이비토·롯카테이·기타카로·로이스가 전부 모여 있는 층. 시내에서 사서 나흘 들고 다니는 것보다 종류·부피·신선도 모두 여기가 유리하다. 70분이면 여유롭게 훑는다.","tip":"로이스 생초콜릿 같은 냉장 제품은 보냉팩을 함께 받을 것(여름엔 필수). 잼·유동식은 100ml 규정 때문에 반드시 위탁수하물에 넣거나 보안검색 후 면세구역에서 살 것.","optional":false,"short":"공항 쇼핑"},{"time":"11:45","title":"국제선 터미널 이동 · 체크인 · 보안검색","name_ja":"国際線ターミナル・チェックイン","kind":"이동","lat":42.787,"lng":141.6759,"duration_min":55,"cost":"-","desc":"국내선 2층에서 연결통로를 따라 국제선 터미널까지 도보 7~10분. 체크인과 출국 수속.","tip":"신치토세공항은 2025년 11월부터 보안검색장 개보수 중이다. 온라인 체크인을 전날 해두면 카운터 대기가 크게 준다. 출발 1시간 10분 전 수속 시작이라 여유가 있지만, 줄이 길면 바로 직원에게 편명을 말할 것.","optional":false,"short":"국제선 터미널"},{"time":"12:40","title":"탑승 게이트","name_ja":"搭乗ゲート","kind":"휴식","lat":42.787,"lng":141.6759,"duration_min":15,"cost":"-","desc":"이스타항공 12:55 신치토세 출발 → 16:00 인천 도착. 집까지는 지하철로 1시간 15분.","tip":"","optional":false,"short":"탑승 게이트"}]}],"stay":{"name":"숙소 (에어비앤비)","addr":"北海道札幌市中央区 南5条西8丁目 일대","addr_en":"Minami 5 Jōnishi 8-chōme, Chuo Ward, Sapporo","lat":43.053,"lng":141.347,"note":"스스키노 교차로에서 서쪽으로 도보 8분, 타누키코지 서쪽 끝까지 도보 6분. 다루마 본점(南5西4)까지 도보 8분이라 첫날 밤 동선이 전부 도보권 안에 들어온다. 옵션으로 넣은 스스키노 천연온천 유코쿄까지도 도보 10분이다. 시전차 中央区役所前이 가깝고 지하철은 스스키노역·니시11초메역 둘 다 도보 10분 안팎. 【공개용 안내】이 페이지에는 숙소를 블록 단위(南5条西8丁目)까지만 표시한다. 정확한 번지는 예약 확인 메일을 볼 것."}};

<script>
try { "use strict";
/* 실제 지도 타일(OpenStreetMap/CARTO) 위에 일정을 얹는다. 렌더링은 Leaflet이 담당한다. */

const DAYS = PLAN.days;
const DC = ['--d1', '--d2', '--d3', '--d4', '--d5'];
const TITLES = ['도착과 첫 밤', '오타루 하루', '서쪽과 모이와산', '도시에서 느리게', '출국'];
const MOVE = new Set(['이동', '휴식']);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const emph = s => esc(s).replace(/【([^】]+)】/g, '<strong>$1</strong>').replace(/\[([^\]]{1,14})\]/g, '<strong>[$1]</strong>');
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

DAYS.forEach(d => { let n = 0; d.items.forEach(it => { it.stop = !MOVE.has(it.kind); if (it.stop) it.no = ++n; }); });

let day = 0, sel = -1;

/* ───────── 화면 밝기 ─────────
   저장해 둔 선택이 있으면 그걸, 없으면 폰 설정을 따른다. 지도 타일도 같이 바뀐다. */
const THEMES = ['light', 'dark'];
const mqDark = window.matchMedia ? matchMedia('(prefers-color-scheme:dark)') : null;
let themeAuto = true;
let theme = mqDark && mqDark.matches ? 'dark' : 'light';
try { const s = localStorage.getItem('spmap_theme'); if (THEMES.includes(s)) { theme = s; themeAuto = false; } } catch (_) {}

/* ───────── 지도 ───────── */
const map = L.map('map', {
  zoomControl: false, attributionControl: false,
  zoomSnap: 0.25, wheelPxPerZoomLevel: 90, tap: true,
}).setView([43.062, 141.350], 13);

/* 밝을 땐 컬러풀한 CARTO Voyager, 어두울 땐 같은 제작사의 다크 베이스맵.
   반전 필터가 아니라 애초에 어둡게 그려진 타일이라 도로·물·공원이 그대로 구분된다. */
const RETINA = (window.devicePixelRatio || 1) > 1.3 ? '@2x' : '';
const TILE_URL = {
  light: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}' + RETINA + '.png',
  dark: 'https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}' + RETINA + '.png',
};
/* 영어 지명 오버레이도 밝기에 맞춰 글자색이 다른 걸로 바꾼다 */
const PLACES_URL = {
  light: 'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
  dark: 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',
};
const ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> &middot; &copy; CARTO';
L.control.attribution({ position: 'bottomleft', prefix: false }).addTo(map);

const tileLayer = L.tileLayer(TILE_URL[theme], {
  attribution: ATTR, subdomains: 'abcd', maxZoom: 19, minZoom: 8, detectRetina: false,
}).addTo(map);
tileLayer.on('tileerror', () => netWarn());

/* 넓게 볼 때만 영어 지명(Sapporo / Chuo-Ku / Otaru …)을 얹는다. 확대하면 사라져 화면이 깨끗해진다 */
const placesLayer = L.tileLayer(PLACES_URL[theme], { maxZoom: 19, opacity: .95 });
function syncPlaces() {
  const show = map.getZoom() <= 14.2;
  if (show && !map.hasLayer(placesLayer)) placesLayer.addTo(map);
  else if (!show && map.hasLayer(placesLayer)) map.removeLayer(placesLayer);
}
map.on('zoomend', syncPlaces);

window.__map = map;   // 디버그용
const routeLayer = L.layerGroup().addTo(map);
const pinLayer = L.layerGroup().addTo(map);

/* 타일이 하나도 안 뜨면 알려준다 */
let warned = false;
function netWarn() {
  if (warned) return; warned = true;
  toast('지도 타일을 못 불러왔어요 — 인터넷 연결을 확인해 주세요');
}

/* ───────── 핀 ───────── */
const stayIcon = L.divIcon({
  className: '', iconSize: [30, 30], iconAnchor: [15, 15],
  html: '<div class="pin stay" title="숙소"><svg viewBox="0 0 12 12" width="13" height="13" aria-hidden="true">' +
        '<path d="M6 1.2L11 5.6V11H7.6V7.6H4.4V11H1V5.6z" fill="currentColor"/></svg></div>',
});
let stayMarker = null;

function activeItems() { return day < 0 ? [] : DAYS[day].items; }

function drawRoute() {
  routeLayer.clearLayers();
  const dayList = day < 0 ? DAYS.map((_, i) => i) : [day];
  dayList.forEach(di => {
    const pts = [];
    DAYS[di].items.forEach(it => {
      const p = [it.lat, it.lng];
      if (!pts.length || pts[pts.length - 1][0] !== p[0] || pts[pts.length - 1][1] !== p[1]) pts.push(p);
    });
    if (pts.length < 2) return;
    L.polyline(pts, {
      color: cssv(DC[di]) || '#888', weight: day < 0 ? 2 : 3,
      opacity: day < 0 ? .35 : .65, dashArray: '2 7', lineCap: 'round', lineJoin: 'round',
      interactive: false,
    }).addTo(routeLayer);
  });
}

function drawPins() {
  pinLayer.clearLayers();
  if (!stayMarker) {
    stayMarker = L.marker([PLAN.stay.lat, PLAN.stay.lng], { icon: stayIcon, zIndexOffset: 400 });
    stayMarker.on('click', openStay);
  }
  if (map.getZoom() >= 12) stayMarker.addTo(pinLayer);   // 멀리서는 도시 이름과 겹쳐 가린다

  const dayList = day < 0 ? DAYS.map((_, i) => i) : [day];
  const raw = [];
  dayList.forEach(di => DAYS[di].items.forEach((it, ii) => {
    if (!it.stop && day < 0) return;
    raw.push({ di, ii, it, pt: map.latLngToContainerPoint([it.lat, it.lng]) });
  }));

  // 화면에서 겹치는 정류지는 묶는다
  const CL = [];
  raw.filter(r => r.it.stop).forEach(r => {
    const c = CL.find(c => c.di === r.di && c.pt.distanceTo(r.pt) < 34);
    if (c) c.m.push(r); else CL.push({ di: r.di, pt: r.pt, m: [r] });
  });
  raw.filter(r => !r.it.stop).forEach(r => {
    if (CL.some(c => c.pt.distanceTo(r.pt) < 22)) return;
    L.marker([r.it.lat, r.it.lng], {
      icon: L.divIcon({ className: '', iconSize: [14, 14], iconAnchor: [7, 7],
        html: `<div class="pin move" style="--dc:var(${DC[r.di]})"></div>` }),
      zIndexOffset: 100,
    }).on('click', () => open(r.di, r.ii)).addTo(pinLayer);
  });

  CL.forEach(c => {
    const multi = c.m.length > 1;
    const first = c.m[0];
    const on = !multi && first.di === day && first.ii === sel;
    const nos = c.m.map(x => x.it.no);
    const label = multi ? `${Math.min(...nos)}–${Math.max(...nos)}` : first.it.no;
    const name = multi ? `${first.it.short} 외 ${c.m.length - 1}곳` : first.it.short;
    const cls = 'pin stop' + (multi ? ' multi' : '') + (on ? ' on' : '') + (first.it.optional ? ' opt' : '');
    const w = 34, h = 34;
    L.marker([first.it.lat, first.it.lng], {
      icon: L.divIcon({ className: '', iconSize: [w, h], iconAnchor: [w / 2, h / 2],
        html: `<div class="${cls}" style="--dc:var(${DC[first.di]})"><b>${esc(String(label))}</b>` +
              (day < 0 ? '' : `<i class="pinlabel">${esc(name)}</i>`) + '</div>' }),
      zIndexOffset: on ? 600 : 300,
    }).on('click', () => {
      if (multi) {
        map.fitBounds(L.latLngBounds(c.m.map(x => [x.it.lat, x.it.lng])).pad(0.35),
          { paddingTopLeft: [24, 96], paddingBottomRight: [24, 140], maxZoom: 17 });
      } else open(first.di, first.ii);
    }).addTo(pinLayer);
  });
}

let redrawT = null;
function redraw() { clearTimeout(redrawT); redrawT = setTimeout(() => { drawPins(); }, 40); }
map.on('zoomend moveend', redraw);

function fitDay(animate) {
  const its = day < 0 ? DAYS.flatMap(d => d.items) : DAYS[day].items;
  const stops = its.filter(x => x.stop);
  const base = stops.length >= 2 ? stops : its;
  const b = L.latLngBounds(base.map(x => [x.lat, x.lng]));
  b.extend([PLAN.stay.lat, PLAN.stay.lng]);
  map.fitBounds(b, {
    paddingTopLeft: [26, 100], paddingBottomRight: [26, 148],
    maxZoom: 16, animate: animate !== false,
  });
  drawRoute(); drawPins();
}

/* ───────── 상단 날짜 ───────── */
$('#days').innerHTML =
  `<button class="dchip" data-d="-1" aria-pressed="false" style="--dc:var(--ink-3)"><i></i>전체</button>` +
  DAYS.map((d, i) => `<button class="dchip" data-d="${i}" aria-pressed="${i === 0}" style="--dc:var(${DC[i]})">
    <i></i>DAY ${i + 1}<small>${d.date.slice(5).replace('-', '.')}</small></button>`).join('');
$('#days').addEventListener('click', e => {
  const b = e.target.closest('.dchip'); if (b) setDay(+b.dataset.d);
});
function setDay(d) {
  day = d; sel = -1;
  document.querySelectorAll('.dchip').forEach(c => c.setAttribute('aria-pressed', +c.dataset.d === day));
  buildStrip(); fitDay();
  try { localStorage.setItem('spmap_day', String(day)); } catch (_) {}
}

function buildStrip() {
  const s = $('#strip');
  if (day < 0) {
    s.innerHTML = DAYS.map((d, i) => `<button class="scard" data-jump="${i}" style="--dc:var(${DC[i]})">
      <div class="st"><span class="num">${i + 1}</span><span class="tm">${d.date.slice(5).replace('-', '.')}</span>
      <span class="dur">${d.items.filter(x => x.stop).length}곳</span></div>
      <div class="nm">${esc(TITLES[i])}</div></button>`).join('');
    return;
  }
  s.innerHTML = DAYS[day].items.map((it, i) => `<button class="scard${it.optional ? ' opt' : ''}" data-i="${i}"
    style="--dc:var(${DC[day]})" aria-current="${i === sel}">
    <div class="st"><span class="num${it.stop ? '' : ' mv'}">${it.stop ? it.no : ''}</span>
    <span class="tm">${esc(it.time)}</span>${it.optional ? '<span class="optchip">옵션</span>'
      : `<span class="dur">${it.duration_min}분</span>`}</div>
    <div class="nm">${esc(it.short)}</div></button>`).join('');
}
$('#strip').addEventListener('click', e => {
  const b = e.target.closest('.scard'); if (!b) return;
  if (b.dataset.jump != null) setDay(+b.dataset.jump); else open(day, +b.dataset.i);
});

/* ───────── 시트 ───────── */
const sheet = $('#sheet'), scrim = $('#scrim');
function open(d, i) {
  if (d !== day) { day = d; document.querySelectorAll('.dchip').forEach(c => c.setAttribute('aria-pressed', +c.dataset.d === day)); drawRoute(); }
  sel = i;
  const it = DAYS[d].items[i], n = DAYS[d].items.length;
  const warn = /주의|함정|절대|반드시|불가능|위험/.test(it.tip || '');
  const q = encodeURIComponent(`${it.lat},${it.lng}`);
  $('#sheetIn').innerHTML = `
    ${it.optional ? '<div class="sh-opt">선택 일정 — 빼도 하루가 성립합니다</div>' : ''}
    <div class="sh-head" style="--dc:var(${DC[d]})">
      <div class="sh-num${it.stop ? '' : ' mv'}">${it.stop ? it.no : '·'}</div>
      <div><div class="sh-t">${esc(it.title)}</div>${it.name_ja ? `<div class="sh-ja">${esc(it.name_ja)}</div>` : ''}</div>
    </div>
    <div class="sh-meta" style="--dc:var(${DC[d]})">
      <span class="pill k">${esc(it.kind)}</span>
      <span class="pill">${esc(it.time)} · ${it.duration_min}분</span>
      ${it.cost && it.cost !== '-' ? `<span class="pill">¥ ${esc(it.cost)}</span>` : ''}
    </div>
    <p class="sh-desc">${emph(it.desc)}</p>
    ${it.tip ? `<div class="sh-tip${warn ? ' warn' : ''}" style="--dc:var(${DC[d]})">${emph(it.tip)}</div>` : ''}
    <a class="navbtn ext" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">
      구글 지도에서 길찾기 ↗</a>
    <div class="sh-nav">
      <button class="navbtn" id="pv" ${i === 0 ? 'disabled' : ''}>← <span class="mono">이전</span></button>
      <button class="navbtn" id="nx" ${i === n - 1 ? 'disabled' : ''}><span class="mono">다음</span> →</button>
    </div>`;
  const pv = $('#pv'), nx = $('#nx');
  if (pv) pv.onclick = () => open(d, i - 1);
  if (nx) nx.onclick = () => open(d, i + 1);
  sheet.classList.add('on'); scrim.classList.add('on');
  buildStrip();
  const card = document.querySelector(`.scard[data-i="${i}"]`);
  if (card) card.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  map.setView([it.lat, it.lng], Math.max(map.getZoom(), 16), { animate: true });
  map.panBy([0, -Math.round(map.getSize().y * 0.18)], { animate: true });
  drawPins();
}
function openStay() {
  const s = PLAN.stay;
  $('#sheetIn').innerHTML = `
    <div class="sh-head" style="--dc:var(--ink)">
      <div class="sh-num" style="background:var(--ink)">⌂</div>
      <div><div class="sh-t">${esc(s.name)}</div><div class="sh-ja">${esc(s.addr)}</div></div>
    </div>
    <div class="sh-meta"><span class="pill">${esc(s.addr_en)}</span></div>
    <p class="sh-desc">${emph(s.note)}</p>`;
  sheet.classList.add('on'); scrim.classList.add('on');
}
function closeSheet() { sheet.classList.remove('on'); scrim.classList.remove('on'); sel = -1; buildStrip(); drawPins(); }
scrim.onclick = closeSheet;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSheet(); closeModal(); }
  if (sel < 0 || day < 0) return;
  if (e.key === 'ArrowRight' && sel < DAYS[day].items.length - 1) open(day, sel + 1);
  if (e.key === 'ArrowLeft' && sel > 0) open(day, sel - 1);
});
(() => {
  const g = $('#grab'); let y0 = null;
  g.addEventListener('pointerdown', e => { y0 = e.clientY; g.setPointerCapture(e.pointerId); sheet.style.transition = 'none'; });
  g.addEventListener('pointermove', e => { if (y0 != null) sheet.style.transform = `translateY(${Math.max(0, e.clientY - y0)}px)`; });
  const end = e => {
    if (y0 == null) return;
    const dy = Math.max(0, e.clientY - y0); y0 = null;
    sheet.style.transition = ''; sheet.style.transform = '';
    if (dy > 70) closeSheet();
  };
  g.addEventListener('pointerup', end); g.addEventListener('pointercancel', end);
})();

/* ───────── 지도 조작 버튼 ───────── */
$('#btnIn').onclick = () => map.zoomIn(1);
$('#btnOut').onclick = () => map.zoomOut(1);
$('#btnFit').onclick = () => fitDay();

/* 화면 밝기 — UI와 지도 타일을 함께 바꾼다 (theme 값은 파일 위쪽에서 이미 정해 뒀다) */
function applyTheme() {
  document.documentElement.setAttribute('data-theme', theme);
  const b = $('#btnTheme');
  if (b) {
    b.setAttribute('aria-label', theme === 'dark' ? '밝게 보기' : '어둡게 보기');
    b.innerHTML = theme === 'dark'
      ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M4.2 12H2M22 12h-2.2M6.3 6.3L4.8 4.8M19.2 19.2l-1.5-1.5M17.7 6.3l1.5-1.5M4.8 19.2l1.5-1.5"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M20 14.5A8.2 8.2 0 019.5 4 8.4 8.4 0 1020 14.5z"/></svg>';
  }
  tileLayer.setUrl(TILE_URL[theme]);
  placesLayer.setUrl(PLACES_URL[theme]);
  drawRoute();   // 경로 색은 CSS 변수에서 읽어 오므로 다시 그려야 반영된다
}
applyTheme();
$('#btnTheme').onclick = () => {
  theme = theme === 'light' ? 'dark' : 'light';
  themeAuto = false;
  try { localStorage.setItem('spmap_theme', theme); } catch (_) {}
  applyTheme();
};
/* 직접 고른 적이 없으면 폰의 다크모드 전환을 그대로 따라간다 */
if (mqDark && mqDark.addEventListener) {
  mqDark.addEventListener('change', e => {
    if (!themeAuto) return;
    theme = e.matches ? 'dark' : 'light';
    applyTheme();
  });
}

/* ───────── 정보 모달 ───────── */
function prose(txt) {
  const out = []; let ul = [];
  String(txt).split('\n').forEach(raw => {
    const l = raw.trim(); if (!l) return;
    if (l[0] === '■') { if (ul.length) { out.push('<ul>' + ul.join('') + '</ul>'); ul = []; }
      return out.push(`<h4>${emph(l.replace(/^■\s*/, ''))}</h4>`); }
    if (l[0] === '·' || l[0] === '→') return ul.push(`<li class="${l[0] === '→' ? 'arrow' : ''}">${emph(l.slice(1).trim())}</li>`);
    if (ul.length) { out.push('<ul>' + ul.join('') + '</ul>'); ul = []; }
    out.push(`<p>${emph(l)}</p>`);
  });
  if (ul.length) out.push('<ul>' + ul.join('') + '</ul>');
  return out.join('');
}
const st = PLAN.stay;
const SECS = [
  ['항공·숙소', `
    <div class="card"><h5>가는 날 · 8/21 금</h5><div class="big">이스타항공<br>인천 09:20 → 신치토세 11:50</div>
      <div class="sm">직항 2시간 30분</div></div>
    <div class="card"><h5>오는 날 · 8/25 화</h5><div class="big">이스타항공<br>신치토세 12:55 → 인천 16:00</div>
      <div class="sm">직항 3시간 5분 · 이스타 왕복, 4박 5일</div></div>
    <div class="card"><h5>숙소</h5><div class="big">${esc(st.name)}</div>
      <div class="sm">${esc(st.addr)}<br><span class="mono" style="font-size:12px">${esc(st.addr_en)}</span></div>
      <div class="sm">${emph(st.note)}</div></div>
    <div class="card"><h5>확정된 것</h5><div class="sm">
      <strong>위탁 수하물</strong> — 두 구간 모두 포함. 냉장 과자와 100ml 넘는 잼류는 위탁에 넣으면 됩니다.<br><br>
      <strong>숙소 4박 연박</strong> — 8/21~25 그대로. 8/24에 짐 싸서 옮길 일이 없습니다.</div></div>`],
  ['준비', `<div id="chks"></div>`],
  ['날씨', `<div class="prose">${prose(PLAN.weather)}</div>`],
  ['교통', `<div class="prose">${prose(PLAN.transport)}</div>`],
  ['우천', `<div class="prose"><ul>${PLAN.rainplan.map(r => `<li>${emph(r)}</li>`).join('')}</ul></div>`],
  ['예산', `<div class="prose">${prose(PLAN.budget)}</div>`],
  ['주의', `<div class="prose">${prose(PLAN.risks)}</div>`],
];
$('#mtabs').innerHTML = SECS.map((s, i) => `<button class="mtab" data-s="${i}" aria-pressed="${i === 0}">${esc(s[0])}</button>`).join('');
$('#mbody').innerHTML = SECS.map((s, i) => `<div class="msec${i === 0 ? ' on' : ''}" data-s="${i}">${s[1]}</div>`).join('');
$('#chks').innerHTML = PLAN.reservations.map((r, i) => {
  const m = r.match(/^【([^】]+)】\s*/);
  const lab = m ? m[1] : '준비', body = m ? r.slice(m[0].length) : r;
  const head = body.split(/\s—\s|\s-\s/)[0].slice(0, 60);
  const rest = body.slice(head.length).replace(/^\s*[—-]\s*/, '');
  return `<label class="chk"><input type="checkbox" data-k="r${i}">
    <span class="chk-t"><b><span class="pri${/선택|참고|확정/.test(lab) ? ' low' : ''}">${esc(lab)}</span>${esc(head)}</b>${emph(rest)}</span></label>`;
}).join('');
$('#mtabs').addEventListener('click', e => {
  const b = e.target.closest('.mtab'); if (!b) return;
  document.querySelectorAll('.mtab').forEach(t => t.setAttribute('aria-pressed', t === b));
  document.querySelectorAll('.msec').forEach(s => s.classList.toggle('on', s.dataset.s === b.dataset.s));
  $('#mbody').scrollTop = 0;
});
$('#mbody').addEventListener('change', e => {
  if (e.target.type === 'checkbox') { try { localStorage.setItem('spmap_' + e.target.dataset.k, e.target.checked ? '1' : ''); } catch (_) {} }
});
document.querySelectorAll('#chks input').forEach(c => { try { if (localStorage.getItem('spmap_' + c.dataset.k)) c.checked = true; } catch (_) {} });
const modal = $('#modal');
$('#btnInfo').onclick = () => { modal.classList.add('on'); modal.setAttribute('aria-hidden', 'false'); };
function closeModal() { modal.classList.remove('on'); modal.setAttribute('aria-hidden', 'true'); }
$('#btnClose').onclick = closeModal;

/* ───────── 시작 ───────── */
function toast(msg) {
  const t = $('#toast'); if (!t) return;
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 3200);
}
let d0 = 0;
try {
  const s = localStorage.getItem('spmap_day'); if (s != null && +s >= -1 && +s < DAYS.length) d0 = +s;
  const n = new Date();
  if (n.getFullYear() === 2026 && n.getMonth() === 7 && n.getDate() >= 21 && n.getDate() <= 25) d0 = n.getDate() - 21;
} catch (_) {}
day = d0;
document.querySelectorAll('.dchip').forEach(c => c.setAttribute('aria-pressed', +c.dataset.d === day));
buildStrip();
map.whenReady(() => {
  syncPlaces();
  // 컨테이너 크기가 확정된 뒤에 맞춰야 축척이 제대로 잡힌다
  map.invalidateSize();
  fitDay(false);
  [120, 400, 900].forEach(ms => setTimeout(() => { map.invalidateSize(); fitDay(false); }, ms));
